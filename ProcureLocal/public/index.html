    <div id="sub_tab_content">
      ${(subViewMap[rtab] || renderDetailOverview)()}
    </div>`;
}

// Action Command Banner
function renderActionBanner() {
  const p = D.p;
  const s = p.stage;
  const cap = p.type === "capex";
  const validInitQuotes = D.quotes.filter(q => q.type === "initial" && q.valid);
  const validFinalQuotes = D.quotes.filter(q => q.type === "final" && q.valid);
  const vendorCount = l => new Set(l.map(q => q.vendor_id)).size;
  const allItemsCovered = l => D.items.length > 0 && D.items.every(it => l.some(q => q.qitems.some(x => x.item_id === it.id && x.rate > 0)));

  let chk = [];
  let btns = "";
  let help = "";

  if (s === "quotations") {
    help = cap ? "Enter quotation from the CITPC approved vendor. Rates must be within CITPC benchmark rate." : `Collect at least ${D.need} competitive vendor quotations. All items must have valid quoted rates.`;
    chk = [
      [`Items added in Requisition (${D.items.length})`, D.items.length > 0],
      [cap ? `Quotation received from CITPC vendor` : `Valid vendor quotations: ${vendorCount(validInitQuotes)} of ${D.need} required`, vendorCount(validInitQuotes) >= D.need],
      ["All items quoted by at least one vendor", allItemsCovered(validInitQuotes)]
    ];
    const ok = chk.every(c => c[1]);
    btns = `
      <button class="btn p s" onclick="openAddQuoteModal('initial')">＋ Add Vendor Quotation</button>
      ${cap ? `<button class="btn g s" ${ok ? '' : 'disabled'} onclick="A('finalize')">Finalise Rates → Proceed to PR</button>` : `<button class="btn g s" ${ok ? '' : 'disabled'} onclick="A('to_negotiation')">Proceed to Negotiation Stage →</button>`}
    `;
  } else if (s === "negotiation") {
    help = "Conduct technical & commercial negotiation. Record all email threads, meetings, and counter-offers in the Emails tab.";
    chk = [[`Negotiation logs / emails recorded: ${D.comms.length}`, D.comms.length > 0]];
    btns = `
      <button class="btn p s" onclick="setTab('em')">＋ Log Email / Counter-Offer</button>
      <button class="btn g s" onclick="A('to_final')">Negotiation Concluded → Collect Final Quotes →</button>
    `;
  } else if (s === "final") {
    help = "Enter final revised quotations from vendors. Lowest landed rate (L1) per item will be automatically recommended.";
    chk = [
      [`Final quotations received: ${vendorCount(validFinalQuotes)}`, vendorCount(validFinalQuotes) > 0],
      ["Every item covered with a final quoted rate", allItemsCovered(validFinalQuotes)]
    ];
    const ok = chk.every(c => c[1]);
    btns = `
      <button class="btn p s" onclick="openAddQuoteModal('final')">＋ Add Final Quotation</button>
      <button class="btn g s" ${ok ? '' : 'disabled'} onclick="A('finalize')">Finalise Quotations → Generate SAP PR →</button>
    `;
  } else if (s === "pr") {
    help = "Create the Purchase Requisition (PR) in SAP using the details below. Once generated, record the SAP PR Number.";
    btns = `
      <div class="row">
        <input id="sap_pr_no" placeholder="Enter SAP PR Number (optional)" style="width:200px;">
        <input id="sap_pr_date" type="date" value="${td()}" style="width:140px;">
        <button class="btn g s" onclick="A('pr_done', { pr_no: $('#sap_pr_no').value, date: $('#sap_pr_date').value })">Save SAP PR Number →</button>
        <button class="btn s" onclick="A('pr_done', { pr_no: 'PR-' + (D.p.code.replace(/[^0-9]/g, '') || '0001') })">⚡ Skip to Logic Note →</button>
      </div>
    `;
  } else if (s === "logic") {
    help = "Prepare the official Logic Note (Technical & Commercial Sanction Memo). Fill in background, justification, and budget heads.";
    btns = `
      <button class="btn p s" onclick="setTab('ln')">✎ Open Logic Note Form</button>
      <button class="btn g s" onclick="generateAndPrintLogicNote()" style="font-weight:700;">🖨️ Generate &amp; Print Logic Note (PDF) →</button>
      <a class="btn s" href="/api/procs/${p.id}/logic/print" target="_blank">🖨️ Preview Printout</a>
    `;
  } else if (s === "hod") {
    help = "Print the official Logic Note, obtain HOD physical signoff, upload the signed scan, and record the HOD approval date.";
    btns = `
      <div class="row" style="gap:8px; align-items:center;">
        <a class="btn p s" style="font-weight:700; background:linear-gradient(135deg, #2563eb, #1d4ed8); color:#fff; box-shadow:0 2px 6px rgba(37,99,235,0.3); padding:7px 16px;" href="/api/procs/${p.id}/logic/print" target="_blank">🖨️ Print Official Logic Note (PDF)</a>
        <input id="hod_sign_date" type="date" value="${td()}" style="width:140px;">
        <button class="btn g s" onclick="A('hod_done', { date: $('#hod_sign_date').value })">HOD Sign Recorded →</button>
      </div>
    `;
  } else if (s === "commercial") {
    help = "Hand over the signed logic note and vendor dossier to the Commercial Department for approval processing.";
    btns = `
      <div class="row">
        <input id="comm_date" type="date" value="${td()}" style="width:140px;">
        <button class="btn g s" onclick="A('comm_done', { date: $('#comm_date').value })">Submitted to Commercial →</button>
      </div>
    `;
  } else if (s === "approvals") {
    const nextAppr = D.approvals.find(a => !a.date);
    help = nextAppr ? `Waiting for SAP Signoff from: <b>${esc(nextAppr.name)}</b> (${esc(nextAppr.desig)})` : "All SAP approvals completed.";
    btns = nextAppr ? `
      <div class="row">
        <input id="appr_date" type="date" value="${td()}" style="width:140px;">
        <input id="appr_rem" placeholder="Approver Remark (optional)" style="width:220px;">
        <button class="btn g s" onclick="A('approve_step', { date: $('#appr_date').value, remark: $('#appr_rem').value })">Mark Approved by ${esc(nextAppr.name)} →</button>
      </div>` : "";
  } else if (s === "order") {
    const hasPo = (D.pos || []).length > 0;
    const hasGrn = (D.grns || []).length > 0;
    const hasInvoice = (D.invoices || []).length > 0;
    const hasAsset = (D.assets || []).length > 0;

    chk = [
      [`Purchase Order Generated (${(D.pos || []).length})`, hasPo],
      [`Material Received at Store / GRN Recorded (${(D.grns || []).length})`, hasGrn],
      [`Vendor Tax Invoice Attached (${(D.invoices || []).length})`, hasInvoice],
      [`Factory Asset Tagged &amp; Capitalized (${(D.assets || []).length})`, hasAsset]
    ];

    if (!hasPo) {
      help = "Approvals complete! Attach your official SAP/ERP Purchase Order file (PDF/Scan) or generate an in-app legal PO.";
      btns = `
        <button class="btn p s" onclick="openAttachPoModal()">📎 Attach Official PO (Upload PDF) →</button>
        <button class="btn s" onclick="openCreatePoModal()">⚙️ Generate In-App PO</button>
      `;
    } else if (!hasGrn) {
      help = "Purchase Order issued! When vendor delivers material to gate/store, record the Material Receipt Date and Delivery Challan.";
      btns = `
        <button class="btn g s" onclick="openCreateGrnModal()">＋ Record Material Receipt (GRN) →</button>
        <button class="btn s" onclick="setTab('po')">View PO &amp; Delivery Details</button>
      `;
    } else if (!hasInvoice) {
      help = "Material received at store (GRN recorded)! Attach the Vendor Tax Invoice (PDF/Scan) to verify GST 3-Way Matching against PO and GRN.";
      btns = `
        <button class="btn p s" onclick="openAttachInvoiceModal()">🧾 Attach Vendor Tax Invoice (Upload PDF) →</button>
        ${!hasAsset ? `<button class="btn g s" onclick="openCreateAssetModal()">＋ Capitalize &amp; Tag Factory Asset →</button>` : ''}
        <button class="btn s" onclick="setTab('po')">View GRN &amp; Inward Details</button>
      `;
    } else if (!hasAsset) {
      help = "Material inward &amp; Vendor Tax Invoice attached! Fill &amp; submit the official Certificate of Completion to Commercial Dept for FAR update, then tag equipment into Factory Asset Register.";
      btns = `
        <button class="btn s p" onclick="openCompletionCertModal(${D.p.id})" style="background:#0284c7; border-color:#0369a1; color:#fff; font-weight:700;">📜 Certificate of Completion Form →</button>
        <button class="btn p s" onclick="openCreateAssetModal()">＋ Capitalize &amp; Tag Factory Asset →</button>
        <button class="btn s" onclick="openAttachInvoiceModal()">🧾 Manage Invoices (${(D.invoices || []).length})</button>
        <button class="btn g s" onclick="openCloseRequisitionModal()">✓ Close Requisition →</button>
      `;
    } else {
      help = "All milestones achieved: Material received, Vendor Tax Invoice attached, and tagged as Factory Asset! Ready for formal closure.";
      btns = `
        <button class="btn g s" style="font-weight:bold; font-size:13px; padding:8px 16px;" onclick="openCloseRequisitionModal()">🏁 Close Requisition (Complete) ✔</button>
        <button class="btn s p" onclick="openCompletionCertModal(${D.p.id})" style="background:#0284c7; border-color:#0369a1; color:#fff;">📜 Completion Certificate (Print)</button>
        <button class="btn s" onclick="openAttachInvoiceModal()">🧾 View Invoice</button>
        <button class="btn s" onclick="setTab('po')">View Asset &amp; GRN Summary</button>
      `;
    }
  } else if (s === "completed") {
    help = `Requisition Formally Closed! Material received on ${dmy(D.p.received_date || D.grns[0]?.grn_date || '—')}, capitalized as Factory Asset (${esc(D.p.asset_code || D.assets[0]?.asset_code || 'Tagged')}), and recorded in corporate archives.`;
    btns = `
      <div class="row" style="align-items:center; gap:8px; flex-wrap:wrap;">
        <a class="btn s" href="/api/procs/${D.p.id}/sap-serial-print" target="_blank" style="background:#16a34a; border-color:#15803d; color:#fff; font-weight:700;" title="Print ONLY SAP Code & OEM Serial Number Barcode Label">🏷️ Print SAP Code &amp; Serial Number ✔</a>
        <button class="btn s p" onclick="openCompletionCertModal(${D.p.id})" style="background:#0284c7; border-color:#0369a1; color:#fff;">📜 Certificate of Completion (Print)</button>
        <button class="btn s" onclick="setTab('po')">View GRN &amp; Asset Record</button>
        ${D.assets && D.assets.length ? `<button class="btn s p" onclick="openAssetLabelModal(${D.assets[0].id})" title="View, Print & Download Industrial Barcode Tag Label">🏷️ Print Asset Tag Barcode Label</button>` : ''}
        ${isLocked(p) ? (adm() || canApproveUnlock() ? `<button class="btn s" style="background:#2563eb; color:#fff; border-color:#1d4ed8; font-weight:700;" onclick="openAdminDirectUnlockModal(${p.id})">🔓 Admin Permission: Unlock for Modification</button>` : `<button class="btn p s" style="background:#475569; border-color:#334155;" onclick="openRequestUnlockModal()">🔓 Request Permission to Edit / Unlock</button>`) : ''}
        ${p.unlock_status === 'unlocked' ? `<button class="btn s" style="background:#dc2626; color:#fff; border-color:#b91c1c; font-weight:700;" onclick="relockRequisition()">🔒 Re-Lock &amp; Freeze Record</button>` : ''}
      </div>
    `;
  }

  return `
    <div class="banner">
      <span class="step-badge">Milestone: ${SL[s] || s}</span>
      <h2>${s === 'completed' ? 'Requisition Fully Completed' : 'Next Action Required'}</h2>
      <p style="margin:2px 0 8px; font-size:13px; color:#334155;">${help}</p>
      ${chk.length ? `<ul class="chk">${chk.map(c => `<li class="${c[1] ? 'y' : 'n'}">${c[1] ? '✔' : '○'} ${c[0]}</li>`).join("")}</ul>` : ""}
      ${btns ? `<div style="margin-top:10px;">${btns}</div>` : ""}
    </div>`;
}

// Quotations Sub-Tab (Points 1, 2, and 4)
function renderDetailQuotes() {
  const cap = D.p.type === "capex";
  const initialQuotes = D.quotes.filter(q => q.type === "initial");
  const finalQuotes = D.quotes.filter(q => q.type === "final");

  // Round 2 Compliance Analysis (Point 2: All initial vendors must submit final revised quotes)
  const initialVendors = [];
  const seenVids = new Set();
  initialQuotes.forEach(q => {
    if (!seenVids.has(q.vendor_id)) {
      seenVids.add(q.vendor_id);
      initialVendors.push({ vendor_id: q.vendor_id, vendor: q.vendor });
    }
  });
  const finalVendorIds = new Set(finalQuotes.map(q => q.vendor_id));
  const missingFinalVendors = initialVendors.filter(v => !finalVendorIds.has(v.vendor_id));

  return `
    <div class="card">
      <div class="card-header">
        <div>
          <h3 style="margin:0;">${cap ? "CITPC Master Vendor Quotation" : "Round 1 Initial Quotations"}</h3>
          <p style="margin:2px 0 0; color:var(--tx-mut); font-size:12px;">Preliminary competitive vendor quotations &amp; RFQ email correspondence</p>
        </div>
        ${can() ? `<button class="btn p s" onclick="openAddQuoteModal('initial')">＋ Add Initial Quotation</button>` : ""}
      </div>
      ${renderQuotesList(initialQuotes)}
    </div>

    ${!cap ? `
      <div class="card">
        <div class="card-header">
          <div>
            <h3 style="margin:0;">Round 2 Final Revised Quotations</h3>
            <p style="margin:2px 0 0; color:var(--tx-mut); font-size:12px;">Final negotiated quotations with vendor email correspondence trail</p>
          </div>
          ${can() ? `<button class="btn p s" onclick="openAddQuoteModal('final')">＋ Add Final Quotation</button>` : ""}
        </div>

        <!-- Compliance Banner for Round 2 (Point 2) -->
        ${initialQuotes.length > 0 ? (
          missingFinalVendors.length > 0 ? `
            <div style="background:#fffbeb; border:1.5px solid #f59e0b; border-radius:8px; padding:12px 14px; margin-bottom:14px;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
                <div>
                  <b style="color:#b45309; font-size:13.5px;">⚠️ Procurement Policy Notice: Final Quotes Required for ALL Initial Vendors</b>
                  <p style="margin:3px 0 8px; font-size:12px; color:#78350f;">
                    Company policy requires that all <b>${initialVendors.length}</b> vendors who quoted in Round 1 must submit a Final Revised Quotation along with the negotiation email trail before advancing to the Logic Note.
                  </p>
                  <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <span style="font-size:12px; font-weight:700; color:#92400e;">Pending Final Quotes (${missingFinalVendors.length}):</span>
                    ${missingFinalVendors.map(v => `
                      <span class="tag b-amber" style="font-weight:700; font-size:11.5px;">${esc(v.vendor)}</span>
                    `).join('')}
                  </div>
                </div>
                <div class="row" style="gap:6px; flex-wrap:wrap;">
                  ${missingFinalVendors.map(v => `
                    <button class="btn s p" onclick="openAddQuoteModal('final', ${v.vendor_id})" style="font-weight:700; background:linear-gradient(135deg, #d97706, #b45309); color:#fff;">
                      ＋ Add Final Quote for ${esc(v.vendor)}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          ` : `
            <div style="background:#f0fdf4; border:1px solid #86efac; border-radius:8px; padding:10px 14px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:18px;">✔</span>
                <span style="color:#15803d; font-size:12.5px; font-weight:700;">
                  100% Round 2 Compliance: All ${initialVendors.length} Round 1 vendors have submitted Final Revised Quotations with email communication trails.
                </span>
              </div>
              <span class="tag b-green">Logic Note Ready</span>
            </div>
          `
        ) : ''}

        ${renderQuotesList(finalQuotes)}
      </div>` : ""}

    ${cap ? renderCapexDocsCard() : ""}`;
}

function renderQuotesList(quotes) {
  if (!quotes.length) return `<p style="color:var(--tx-mut); padding:8px 0;">No quotations recorded in this round.</p>`;
  return quotes.map(q => {
    const qDoc = (D.docs || []).find(d => d.id === q.doc_id);
    const qDocName = (qDoc && (qDoc.orig || qDoc.name)) || q.doc_name || (q.vendor + ' Quotation');
    const mDoc = (D.docs || []).find(d => d.id === q.mail_doc_id);
    const mDocName = (mDoc && (mDoc.orig || mDoc.name)) || q.mail_doc_name || (q.vendor + ' Email Trail');

    return `
    <div style="background:#f8fafc; border:1px solid var(--bd); border-radius:8px; padding:12px; margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
        <div>
          <b style="font-size:14px; color:#0f172a;">${esc(q.vendor)}</b>
          <span class="tag ${q.valid ? 'b-green' : 'b-red'}" style="margin-left:6px;">${q.valid ? '✔ Valid Quotation' : '✘ Discrepancy Found'}</span>
          <div style="font-size:11.5px; color:var(--tx-mut); margin-top:2px;">
            Quote Ref: <b>${esc(q.ref || 'NA')}</b> · Date: ${dmy(q.qdate)} · GSTIN: <code>${esc(q.gst)}</code> · Delivery: ${esc(q.delivery)}
          </div>
        </div>
        <div class="row" style="gap:6px; flex-wrap:wrap;">
          ${can() ? `<button class="btn s" onclick="openEditQuoteModal(${q.id})">✏️ Edit Rates &amp; Docs</button>` : ''}
          ${adm() ? `<button class="btn s r" onclick="deleteQuote(${q.id})">Remove</button>` : ''}
        </div>
      </div>

      <!-- Proof Documents Row: Quotation File + Email Communication PDF (Points 1 & 2) -->
      <div style="display:flex; align-items:center; gap:8px; margin:8px 0; padding:6px 10px; background:#fff; border:1px solid #e2e8f0; border-radius:6px; flex-wrap:wrap;">
        <span style="font-size:11.5px; font-weight:700; color:#334155;">Attached Proofs:</span>

        <!-- Commercial Quote Doc -->
        ${q.doc_id ? `
          <div class="row" style="gap:2px; align-items:center;">
            <button class="btn s p" onclick="openDocViewer(${q.doc_id}, '${esc(qDocName)}', 'Quotations', '${esc(D.p.code)}', '${esc(q.vendor)}')" title="Preview vendor quotation PDF/file" style="font-size:11px; padding:2px 8px;">
              📄 View Quote PDF
            </button>
            <a class="btn s" href="/api/docs/${q.doc_id}/download" download title="Download Quote File" style="font-size:11px; padding:2px 6px;">📥</a>
          </div>
        ` : `
          <button class="btn s" style="font-size:11px; padding:2px 8px; border:1px dashed #94a3b8; color:#64748b;" onclick="openEditQuoteModal(${q.id})">
            📄 + Attach Quote File
          </button>
        `}

        <!-- Email Communication PDF (Points 1 & 2) -->
        ${q.mail_doc_id ? `
          <div class="row" style="gap:2px; align-items:center;">
            <button class="btn s" style="background:#0284c7; color:#fff; font-size:11px; padding:2px 8px;" onclick="openDocViewer(${q.mail_doc_id}, '${esc(mDocName)}', 'Emails', '${esc(D.p.code)}', '${esc(q.vendor)}')" title="Preview vendor negotiation email correspondence">
              ✉️ View Email PDF
            </button>
            <a class="btn s" href="/api/docs/${q.mail_doc_id}/download" download title="Download Email PDF" style="font-size:11px; padding:2px 6px;">📥</a>
          </div>
        ` : `
          <button class="btn s" style="font-size:11px; padding:2px 8px; border:1px dashed #0284c7; color:#0284c7; background:#f0f9ff;" onclick="openAttachMailModal(${q.id})" title="Attach vendor email negotiation PDF">
            ✉️ + Attach Email PDF
          </button>
        `}
      </div>

      <table style="margin-top:4px; background:#fff; border-radius:6px; overflow:hidden;">
        <thead>
          <tr><th>Item</th><th class="center">Qty</th><th class="num">Quoted Basic Rate</th><th class="center">GST %</th><th class="num">Total Landed / Unit</th></tr>
        </thead>
        <tbody>
          ${q.qitems.map(qi => {
            const it = D.items.find(i => i.id === qi.item_id);
            return it ? `
              <tr>
                <td><b>${esc(it.name)}</b></td>
                <td class="center">${it.qty} ${esc(it.unit)}</td>
                <td class="num">${inr(qi.rate)}</td>
                <td class="center">${qi.gst}%</td>
                <td class="num"><b>${inr(gt(qi.rate, qi.gst))}</b></td>
              </tr>` : '';
          }).join("")}
        </tbody>
      </table>
    </div>`;
  }).join("");
}

const saveCapexDocModal = () => T(async () => {
  const file = $("#cx_file")?.files[0];
  if (!file) return alert("Please select a document file to upload.");
  const type = $("#cx_type")?.value || "Capex Sanction Memo";
  const title = $("#cx_title")?.value || file.name;
  const fileName = `${type} - ${title} - ${file.name}`;
  const r = await fetch(`/api/procs/${sel}/upload?category=CapexDocs&vendor=Internal`, {
    method: "POST",
    headers: { "x-filename": encodeURIComponent(fileName) },
    body: file
  });
  if (!r.ok) return alert("Document upload failed.");
  $("#capex_doc_modal")?.remove();
  toast("Capex Document Uploaded ✔");
  load();
});

  // Calculation for live preview
  const items = D.items || [];

    let b = 0, l = 0, n = 0;
    for (const x of (q.qitems || [])) {
      const it = items.find(i => i.id === x.item_id);
      if (it && x.rate > 0) {
        b += x.rate * it.qty;
        l += gt(x.rate, x.gst) * it.qty;
        n++;
      }
    }
    return { q, b, l, n, full: items.length > 0 && n === items.length };
  });
  const full = cols.filter(c => c.full).sort((a, b) => a.l - b.l);

  const numFmt = n => Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const formatDmy = d => {
    if (!d) return '';
    const parts = String(d).slice(0, 10).split(/[-./]/);
    if (parts.length === 3) {
      if (parts[0].length === 4) return `${parts[2]}.${parts[1]}.${parts[0]}`;
      return `${parts[0]}.${parts[1]}.${parts[2]}`;

  if ($("#pv_cost_centre") && $("#ln_cost_centre")) $("#pv_cost_centre").innerText = $("#ln_cost_centre").value;
  if ($("#pv_gl_code") && $("#ln_gl_code")) $("#pv_gl_code").innerText = $("#ln_gl_code").value;
  if ($("#pv_budget_available") && $("#ln_budget_available")) $("#pv_budget_available").innerText = $("#ln_budget_available").value;

  if ($("#pv_cash_flow") && $("#ln_cash_flow")) $("#pv_cash_flow").innerText = $("#ln_cash_flow").value ? ` - ${$("#ln_cash_flow").value}` : "";

  if ($("#pv_qual_eval") && $("#ln_qual_eval")) $("#pv_qual_eval").innerHTML = nl($("#ln_qual_eval").value);

  const selVid = $("#ln_vendor_select")?.value;

function autoSuggestJustification() {
  const p = D.p;
  const vendors = [...new Set(D.items.map(i => i.final_vendor).filter(Boolean))].join(", ");
  const totalLanded = D.items.reduce((a, i) => a + gt(i.final_rate || 0, i.final_gst) * i.qty, 0);

  if (p.type === "capex") {
    $("#ln_final_reason").value = `${vendors || 'The approved vendor'} is recommended as the CITPC approved vendor; quoted rates are within CITPC pre-approved benchmarks (Ref: ${p.citpc_ref || 'CITPC Master'}). Total landed procurement value is ${inr(totalLanded)}. Sanction is requested to award the contract.`;
  } else {
    $("#ln_final_reason").value = `${vendors || 'The recommended vendor'} is technically qualified and has quoted the lowest landed cost (${inr(totalLanded)}) among all participating bidders (L1). Quotations were strictly evaluated on equal commercial terms. Sanction is requested to place the Purchase Order.`;
  }
  syncLogicPreview();
  toast("Draft Justification Generated ✨");
}

// Logic Note Vendor Selection Handlers (Point 3)
function onVendorSelectionDropdownChange(vid) {
  const q = (D.quotes || []).find(x => x.vendor_id == vid);
  if (!q) return;
  const basis = $('#ln_selection_basis')?.value || 'L1 Lowest Commercial Bidder';
  suggestJustificationForVendor(q.vendor, basis);
  syncLogicPreview();
}

function onSelectionBasisChange(basis) {
  const vid = $('#ln_vendor_select')?.value;
  const q = (D.quotes || []).find(x => x.vendor_id == vid);
  const vendorName = q?.vendor || D.p.citpc_vendor || 'The selected vendor';
  suggestJustificationForVendor(vendorName, basis);
  syncLogicPreview();
}

function suggestJustificationForVendor(vendorName, basis) {
  const items = D.items || [];
  const totalLanded = items.reduce((a, i) => a + gt(i.final_rate || 0, i.final_gst) * i.qty, 0);
  if ($('#ln_final_reason')) {
    if (basis.startsWith('L1')) {
      $('#ln_final_reason').value = `${vendorName} is recommended for this job as they are technically qualified and have quoted the lowest landed cost (${inr(totalLanded)}) among all participating bidders (L1). Quotations were strictly evaluated on equal commercial terms. Sanction is requested to award the contract.`;
    } else if (basis.includes('Technically')) {
      $('#ln_final_reason').value = `${vendorName} is recommended on technical merits and superior compliance with plant specifications. The vendor possesses proven track record, superior engineering capabilities, and comprehensive warranty coverage. Approval is requested to award the work.`;
    } else if (basis.includes('Sole')) {
      $('#ln_final_reason').value = `${vendorName} is the sole proprietary manufacturer and authorized OEM for the required equipment and spares. No alternate compatible source exists. Sanction is requested for proprietary procurement.`;
    } else if (basis.includes('Lead Time')) {
      $('#ln_final_reason').value = `${vendorName} is selected to meet critical project timelines with the shortest delivery commitment. Their committed delivery schedule minimizes plant downtime and aligns with operational shutdown targets.`;
    } else if (basis.includes('Standardization')) {
      $('#ln_final_reason').value = `${vendorName} is selected for plant standardization to maintain equipment interchangeability, existing spare parts inventory compatibility, and uniform maintenance procedures.`;
    } else {
      $('#ln_final_reason').value = `${vendorName} is recommended based on technical and commercial evaluation (Basis: ${basis}). Approval is requested to issue the formal Purchase Order.`;
    }
  }
}

const uploadDoc = async () => {
  const f = $("#doc_file").files[0];
  if (!f) return alert("Select a file to upload");
  const cat = $("#doc_cat").value;
  const r = await fetch(`/api/procs/${sel}/upload?category=${cat}`, {
    method: "POST",
    headers: { "x-filename": encodeURIComponent(f.name) },
    body: f
  });
  if (!r.ok) return alert("Upload failed");
  toast("File Uploaded ✔");
  load();
};

const deleteDoc = id => {
  if (!adm()) return alert("Permission Denied: Only Administrator accounts can delete attachments.");
  const d = (D && D.docs ? D.docs : []).find(x => x.id === id) || { id, name: 'Attachment File' };
  openSecurityDeleteModal({
    title: "Security Authorization: Delete Attachment",
    entityType: "Requisition Document Attachment",
    entityCode: `DOC #${id}`,
    entityName: d.name,
    details: [
      { label: "Category", value: esc(d.category || 'Attachment') }
    ],
    warning: `Permanently deleting attachment "${esc(d.name)}" will remove the physical file from storage and unlink it from this requisition.`,
    onExecute: async ({ confirm, password }) => {
      await api("DELETE", `/api/docs/${id}`, { confirm, password });
      toast(`Document "${d.name}" securely deleted ✔`);
      load();
    }
  });
};

  toast("Unlock request submitted for approval! ✔");
  load();
});

function autoFillVendorInitialRates(vid, type) {
  if (type !== 'final' || !vid) return;
  const initQ = (D.quotes || []).find(q => q.vendor_id == vid && q.type === 'initial');
  if (initQ) {
    if ($("#mq_ref") && !$("#mq_ref").value) $("#mq_ref").value = (initQ.ref || 'QT') + '-REV';
    (D.items || []).forEach(it => {
      const prev = initQ.qitems?.find(x => x.item_id === it.id);
      if (prev && $(`#qrate_${it.id}`) && !+$(`#qrate_${it.id}`).value) {
        $(`#qrate_${it.id}`).value = prev.rate || '';
        if ($(`#qgst_${it.id}`)) $(`#qgst_${it.id}`).value = prev.gst !== undefined ? prev.gst : 18;
      }
    });
  }
}

const saveQuotationModal = type => T(async () => {
  const vid = +$("#mq_vendor").value;
  if (!vid) return alert("Select a vendor");
  const quoteItems = D.items.map(it => ({
    item_id: it.id,
    rate: +$(`#qrate_${it.id}`).value || 0,
    gst: +$(`#qgst_${it.id}`).value || 18
  })).filter(x => x.rate > 0);

  if (!quoteItems.length) return alert("Enter quoted rate for at least one item");

  const mailFile = $("#mq_mail_file")?.files[0];
  if (type === 'final' && !mailFile) {
    if (!confirm("⚠️ Procurement Compliance Notice:\nAttaching the vendor negotiation email correspondence trail PDF is required for Round 2.\n\nDo you want to save without email PDF now? (You can attach it later before final approval).")) {
      return;
    }
  }

  const r = await api("POST", `/api/procs/${sel}/quotes`, {
    type,
    vendor_id: vid,
    ref: $("#mq_ref").value,
    qdate: $("#mq_date").value,
    recipient: $("#mq_recip").value,
    delivery: $("#mq_deliv").value,
    items: quoteItems
  });

  const vName = V.find(v => v.id === vid)?.name || "Vendor";

  const file = $("#mq_file").files[0];
  if (file) {
    await fetch(`/api/procs/${sel}/upload?category=${type === 'final' ? 'FinalQuotations' : 'Quotations'}&vendor=${encodeURIComponent(vName)}&quote_id=${r.id}`, {
      method: "POST",
      headers: { "x-filename": encodeURIComponent(file.name) },
      body: file
    });
  }

  if (mailFile) {
    await fetch(`/api/procs/${sel}/upload?category=Emails&vendor=${encodeURIComponent(vName)}&mail_quote_id=${r.id}`, {
      method: "POST",
      headers: { "x-filename": encodeURIComponent(mailFile.name) },
      body: mailFile
    });
  }

  $("#quote_modal").remove();
  toast("Quotation & Documents Saved ✔");
  load();
});

const saveAttachPoAction = () => T(async () => {
  const fileInput = $("#po_up_file");
  const file = fileInput?.files?.[0];
  if (!file) {
    alert("Please select the Official PO file (PDF / Scan) to upload!");
    fileInput?.focus();
    return;
  }

  const poNo = ($("#po_up_no")?.value || '').trim();
  if (!poNo) {
    alert("Please enter the Official PO / SAP Number!");
    $("#po_up_no")?.focus();
    return;
  }

  const vendorId = +($("#po_up_vendor")?.value || 0);
  if (!vendorId) {
    alert("Please select the awarded vendor!");
    return;
  }

  const saveBtn = $("#btn_save_po_attach");
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.innerText = "Uploading PO File...";
  }

  let uploadedDocId = null;
  try {
    const vSelect = $("#po_up_vendor");
    const vName = vSelect ? (vSelect.options[vSelect.selectedIndex]?.text || '') : '';

    // Step 1: Upload the PO document to /api/procs/:id/upload
    const uploadRes = await fetch(`/api/procs/${sel}/upload?category=PurchaseOrder&vendor=${encodeURIComponent(vName)}`, {
      method: "POST",
      headers: { "x-filename": encodeURIComponent(file.name) },
      body: file
    });
    if (!uploadRes.ok) throw new Error("Failed to upload PO file to server");
    const uploadData = await uploadRes.json();
    uploadedDocId = uploadData.id;

    // Step 2: Record the PO
    const itemIds = [...$$(".po-up-itm-chk:checked")].map(el => +el.value);
    const r = await api("POST", `/api/procs/${sel}/pos`, {
      po_no: poNo,
      po_date: $("#po_up_date")?.value || td(),
      vendor_id: vendorId,
      total_landed: +($("#po_up_amount")?.value || 0),
      payment_terms: $("#po_up_pay_terms")?.value || '30 days from GRN',
      delivery_terms: $("#po_up_del_terms")?.value || 'Within 14 days',
      remarks: ($("#po_up_remarks")?.value || '').trim(),
      is_uploaded: 1,
      doc_id: uploadedDocId,
      item_ids: itemIds
    });

    $("#po_attach_modal").remove();
    toast("Official Purchase Order Attached: " + r.po_no + " ✔");
    load();
  } catch (err) {
    // Roll back uploaded document if PO recording failed to prevent duplicate/orphan files in Document Vault
    if (uploadedDocId) {
      try { await fetch(`/api/docs/${uploadedDocId}`, { method: 'DELETE' }); } catch {}
    }
    alert("Error attaching PO: " + (err.message || err));
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerText = "📎 Upload Document & Attach Official PO";
    }
  }
});

function calcInvoiceGstBreakup() {
  const tot = +$("#inv_total_amt")?.value || 0;
  const base = Math.round((tot / 1.18) * 100) / 100;
  const gst = Math.round((tot - base) * 100) / 100;
  if ($("#inv_base_amt")) $("#inv_base_amt").value = base;
  if ($("#inv_gst_amt")) $("#inv_gst_amt").value = gst;
}

const saveAttachInvoiceAction = () => T(async () => {
  const fileInput = $("#inv_file");
  const file = fileInput?.files?.[0];
  if (!file) {
    alert("Please select the Vendor Tax Invoice file (PDF / Scan) to upload!");
    fileInput?.focus();
    return;
  }

  const invNo = $("#inv_no").value.trim();
  if (!invNo) {
    alert("Please enter the Vendor Invoice Number!");
    $("#inv_no").focus();
    return;
  }

  const totalAmount = +$("#inv_total_amt").value;
  if (!totalAmount || totalAmount <= 0) {
    alert("Please enter a valid Total Invoiced Amount!");
    $("#inv_total_amt").focus();
    return;
  }

  const saveBtn = $("#btn_save_inv");
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.innerText = "Uploading Invoice File...";
  }

  try {
    const poSelect = $("#inv_po_id");
    const vText = poSelect && poSelect.selectedIndex >= 0 ? poSelect.options[poSelect.selectedIndex]?.text : '';

    // Step 1: Upload the invoice file to /api/procs/:id/upload?category=Invoices
    const uploadRes = await fetch(`/api/procs/${sel}/upload?category=Invoices&vendor=${encodeURIComponent(vText)}`, {
      method: "POST",
      headers: { "x-filename": encodeURIComponent(file.name) },
      body: file
    });
    if (!uploadRes.ok) throw new Error("Failed to upload Invoice file to server");
    const uploadData = await uploadRes.json();
    const docId = uploadData.id;

    // Step 2: Record Invoice
    const poId = poSelect ? (+poSelect.value || null) : null;
    const r = await api("POST", `/api/procs/${sel}/invoices`, {
      po_id: poId,
      invoice_no: invNo,
      invoice_date: $("#inv_date").value || td(),
      total_amount: totalAmount,
      amount: +$("#inv_base_amt").value || (totalAmount / 1.18),
      gst_amount: +$("#inv_gst_amt").value || (totalAmount - (totalAmount / 1.18)),
      remarks: $("#inv_remarks").value.trim(),
      doc_id: docId
    });

    $("#invoice_modal").remove();
    toast(`Vendor Tax Invoice Attached: ${invNo} (${r.match_status}) ✔`);
    load();
  } catch (err) {
    alert("Error attaching Invoice: " + (err.message || err));
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerText = "🧾 Upload Document & Attach Invoice";
    }
  }
});

const deleteInvoice = (invId) => {

  const inv = (D && D.invoices ? D.invoices : []).find(x => x.id === invId) || { id: invId, invoice_no: `INV #${invId}` };
  openSecurityDeleteModal({
    title: "Security Authorization: Delete Vendor Invoice",
    entityType: "Vendor Invoice (3-Way Match)",

};

        <input style="width:100%; font-family:monospace; font-size:11.5px;" value="${esc(it.sap_asset_no || '')}" placeholder="Leave blank for Commercial or enter SAP Asset #" oninput="window._currCertItems[${idx}].sap_asset_no=this.value">
      </td>
      <td style="text-align:center; padding:4px;">
        <button class="btn s" style="color:var(--er); padding:2px 6px;" onclick="removeCommercialCertItem(${idx})" title="Remove Row">✕</button>
      </td>
    </tr>
  `).join('') || `<tr><td colspan="3" style="padding:12px; text-align:center; color:var(--tx-mut);">No asset particulars entered. Click "+ Add Asset Row".</td></tr>`;
}

function addCommercialCertItem() {
  if (!window._currCertItems) window._currCertItems = [];
  window._currCertItems.push({ particular: '', sap_asset_no: '' });
  renderCommercialCertTable();
}

function removeCommercialCertItem(idx) {
  if (!window._currCertItems) return;
  window._currCertItems.splice(idx, 1);
  renderCommercialCertTable();
}

function syncSerialToCommercialItems() {
  const raw = ($('#cert_serial_no')?.value || '').trim();
  if (!raw) return;
  const list = raw.split(',').map(s => s.trim()).filter(Boolean);
  if (!list.length) return;
  const existingMap = new Map();
  (window._currCertItems || []).forEach(it => {
    if (it.particular) existingMap.set(it.particular, it.sap_asset_no);
  });
  window._currCertItems = list.map(s => ({
    particular: s,
    sap_asset_no: existingMap.get(s) || ''
  }));
  renderCommercialCertTable();
}

async function saveCompletionCertData(procId, andPrint) {
  const isTemplate = !procId || procId === 'null' || procId === 'template_sample' || procId === 'template_blank';
  if (isTemplate) {
    toast("Opening Certificate of Completion standard plant layout for printing ✔");
    window.open('/api/forms/completion-cert/print' + (andPrint ? '?autoprint=1' : ''), '_blank');
    $("#completion_cert_modal")?.remove();
    return;
  }
  const payload = {
    company_name: ($("#cert_company_name")?.value || '').trim() || 'ITC LIMITED',
    factory_name: ($("#cert_factory_name")?.value || '').trim() || 'ITD - RANJANGAON CIGARETTE FACTORY',
    plant_address: ($("#cert_plant_address")?.value || '').trim() || 'PLOT-B27, MIDC, RANJANGAON, PUNE - 412220',
    io_no: ($("#cert_io_no")?.value || '').trim(),
    io_desc: ($("#cert_io_desc")?.value || '').trim(),
    po_no: ($("#cert_po_no")?.value || '').trim(),
    install_date: ($("#cert_install_date")?.value || '').trim(),
    location: ($("#cert_location")?.value || '').trim(),
    model_name: ($("#cert_model_name")?.value || '').trim(),
    serial_numbers: ($("#cert_serial_no")?.value || '').trim(),
    remarks: ($("#cert_remarks")?.value || '').trim(),
    asset_count: ($("#cert_asset_count")?.value || '').trim(),
    project_incharge: ($("#cert_project_incharge")?.value || '').trim(),
    head_of_user_dept: ($("#cert_head_of_user_dept")?.value || '').trim(),
    commercial_items: window._currCertItems || []
  };

  try {
    await api("POST", `/api/procs/${procId}/completion-cert`, payload);
    toast("Certificate of Completion Saved & Archived in Vault ✔");
    if (andPrint) {

async function saveCitpcNoteData(procId, andPrint) {
  const isTemplate = !procId || procId === 'null' || procId === 'template_sample' || procId === 'template_blank';
  if (isTemplate) {
    toast("Opening IT CITPC Note standard plant layout for printing ✔");
    window.open('/api/forms/citpc-note/print' + (andPrint ? '?autoprint=1' : ''), '_blank');
    $("#citpc_note_modal")?.remove();
    return;
  }
  const payload = {
    title: ($("#citpc_title")?.value || '').trim(),
    division: ($("#citpc_division")?.value || '').trim(),
    indenter_name: ($("#citpc_indenter_name")?.value || '').trim(),
    citpc_required: ($("#citpc_required")?.value || 'Yes').trim(),
    request_type: 'Request Type I',
    type_hardware: ($("#citpc_type_hardware")?.value || 'Hardware').trim(),
    subtype_name: ($("#citpc_subtype_name")?.value || 'Standard Switches / Routers.').trim(),
    lead_time_ok: ($("#citpc_lead_time_ok")?.value || 'Yes').trim(),
    background: ($("#citpc_background")?.value || '').trim(),
    need: ($("#citpc_need")?.value || '').trim(),
    req_details: ($("#citpc_req_details")?.value || '').trim(),
    vendors_considered: ($("#citpc_vendors_considered")?.value || '').trim(),
    tech_evaluation: ($("#citpc_tech_evaluation")?.value || '').trim(),
    negotiation_history: ($("#citpc_negotiation_history")?.value || 'NA').trim(),
    brand_options: {
      capacity_aug: Boolean($("#citpc_brand_cap_aug")?.checked),
      standardized: Boolean($("#citpc_brand_std")?.checked),
      cio_approved: Boolean($("#citpc_brand_cio")?.checked)
    },
    attach_proposals: ($("#citpc_attach_proposals")?.value || '').trim(),
    scope_certified: ($("#citpc_scope_certified")?.value || 'Y').trim(),
    additional_info: ($("#citpc_additional_info")?.value || '').trim()
  };

  try {
    await api("POST", `/api/procs/${procId}/citpc-note`, payload);
    toast("IT CITPC Note Saved & Archived in Vault ✔");
    if (andPrint) {
      window.open(`/api/procs/${procId}/citpc-note/print?autoprint=1`, '_blank');
    }
    $("#citpc_note_modal")?.remove();
    load();
  } catch (err) {
    alert("Failed to save CITPC note: " + err.message);
  }
}

function updateAssetUnitRows() {
  const tbody = $("#ast_units_tbody");
  if (!tbody) return;
  const qtyInput = $("#ast_qty");
  let qty = Math.max(1, parseInt(qtyInput ? qtyInput.value : 1, 10) || 1);
  if (qty > 100) qty = 100;
  if (qtyInput) qtyInput.value = qty;

  const lbl = $("#ast_units_count_lbl");
  if (lbl) lbl.innerText = qty;

  const totalCost = +$("#ast_cost")?.value || 0;
  const unitCost = (totalCost / qty).toFixed(2);
  const baseLoc = $("#ast_loc")?.value || 'Main Plant';

  // Read existing inputs to preserve what user typed
  const existing = [];
  const oldRows = $$(".ast-unit-row");
  for (const r of oldRows) {
    const idx = r.dataset.idx;
    existing.push({
      code: $(`#ast_u_code_${idx}`)?.value || '',
      serial: $(`#ast_u_serial_${idx}`)?.value || '',
      cost: $(`#ast_u_cost_${idx}`)?.value || '',
      loc: $(`#ast_u_loc_${idx}`)?.value || ''
    });
  }

  let html = '';
  for (let i = 1; i <= qty; i++) {
    const prev = existing[i - 1] || {};
    html += `
      <tr class="ast-unit-row" data-idx="${i}">
        <td style="text-align:center; font-weight:700; color:var(--tx-mut);">${i}</td>
        <td>
          <input id="ast_u_code_${i}" style="font-family:monospace; font-size:11.5px;" placeholder="SAP Code (or Auto)" value="${esc(prev.code || '')}">
        </td>
        <td>
          <input id="ast_u_serial_${i}" style="font-weight:600; font-family:monospace;" placeholder="e.g. SN-88231-X${i}" value="${esc(prev.serial || '')}">
        </td>
        <td>
          <input id="ast_u_cost_${i}" type="number" step="0.01" style="font-size:11.5px;" value="${prev.cost || unitCost}">
        </td>
        <td>
          <input id="ast_u_loc_${i}" style="font-size:11.5px;" placeholder="${esc(baseLoc)}" value="${esc(prev.loc || baseLoc)}">
        </td>
        <td style="text-align:center;">
          ${qty > 1 ? `<button type="button" class="btn s" style="color:var(--er); padding:2px 6px; font-weight:bold;" onclick="removeAssetUnitRow(${i})" title="Remove Unit">✕</button>` : ''}
        </td>
      </tr>`;
  }
  tbody.innerHTML = html;
}

function applyBulkSerials(text) {
  if (!text) return;
  const serials = text.split(/[\r\n,\t;]+/).map(s => s.trim()).filter(Boolean);
  if (!serials.length) return;

  const qtyInput = $("#ast_qty");
  if (qtyInput && serials.length > +qtyInput.value) {
    qtyInput.value = serials.length;
    updateAssetUnitRows();
  }

  const rows = $$(".ast-unit-row");
  serials.forEach((sn, idx) => {
    if (rows[idx]) {
      const uIdx = rows[idx].dataset.idx;
      const inp = $(`#ast_u_serial_${uIdx}`);
      if (inp) inp.value = sn;
    }
  });
  toast(`Applied ${Math.min(serials.length, rows.length)} serial numbers ✔`);
}

function addAssetUnitRow() {
  const qtyInput = $("#ast_qty");
  if (qtyInput) {
    qtyInput.value = (+qtyInput.value || 1) + 1;
    updateAssetUnitRows();
  }
}

function removeAssetUnitRow(targetIdx) {
  const oldRows = $$(".ast-unit-row");
  if (oldRows.length <= 1) return;
  const remaining = [];
  for (const r of oldRows) {
    const idx = +r.dataset.idx;
    if (idx !== targetIdx) {
      remaining.push({
        code: $(`#ast_u_code_${idx}`)?.value || '',
        serial: $(`#ast_u_serial_${idx}`)?.value || '',
        cost: $(`#ast_u_cost_${idx}`)?.value || '',
        loc: $(`#ast_u_loc_${idx}`)?.value || ''
      });
    }
  }
  const qtyInput = $("#ast_qty");
  if (qtyInput) qtyInput.value = remaining.length;
  updateAssetUnitRows();

  const newRows = $$(".ast-unit-row");
  remaining.forEach((item, idx) => {
    if (newRows[idx]) {
      const uIdx = newRows[idx].dataset.idx;
      if ($(`#ast_u_code_${uIdx}`)) $(`#ast_u_code_${uIdx}`).value = item.code;
      if ($(`#ast_u_serial_${uIdx}`)) $(`#ast_u_serial_${uIdx}`).value = item.serial;
      if ($(`#ast_u_cost_${uIdx}`)) $(`#ast_u_cost_${uIdx}`).value = item.cost;
      if ($(`#ast_u_loc_${uIdx}`)) $(`#ast_u_loc_${uIdx}`).value = item.loc;
    }
  });
}

function recalcUnitCosts() {
  const totalCost = +$("#ast_cost")?.value || 0;
  const rows = $$(".ast-unit-row");
  if (!rows.length) return;
  const unitCost = (totalCost / rows.length).toFixed(2);
  rows.forEach(r => {
    const uIdx = r.dataset.idx;
    const inp = $(`#ast_u_cost_${uIdx}`);
    if (inp) inp.value = unitCost;
  });
}

function onAssetItemChange() {
  const sel = $("#ast_item_sel");
  if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.value) return;
  const name = opt.dataset.name;
  const qty = parseInt(opt.dataset.qty, 10) || 1;
  if (name && $("#ast_name")) $("#ast_name").value = name;
  if (qty && $("#ast_qty")) {
    $("#ast_qty").value = qty;
    updateAssetUnitRows();
  }
}

const saveAssetAction = (poId) => T(async () => {
  const name = $("#ast_name").value.trim();
  if (!name) return alert("Equipment / Asset Name is required.");

  const rows = $$(".ast-unit-row");
  const units = [];
  const seenCodes = new Map();
  const seenSerials = new Map();

  for (const r of rows) {
    const uIdx = r.dataset.idx;
    const serial = $(`#ast_u_serial_${uIdx}`)?.value.trim() || '';
    const code = $(`#ast_u_code_${uIdx}`)?.value.trim() || '';
    const cost = +$(`#ast_u_cost_${uIdx}`)?.value || 0;
    const loc = $(`#ast_u_loc_${uIdx}`)?.value.trim() || $("#ast_loc").value;

    // Check intra-batch duplicate SAP Codes
    if (code) {
      const codeKey = code.toLowerCase();
      if (seenCodes.has(codeKey)) {
        alert(`❌ Duplicate SAP Code detected!\n\nUnit #${seenCodes.get(codeKey)} and Unit #${uIdx} both have the same SAP Code "${code}".\n\nEach asset must have a unique SAP Code.`);
        $(`#ast_u_code_${uIdx}`)?.focus();
        return;
      }
      seenCodes.set(codeKey, uIdx);
    }

    // Check intra-batch duplicate OEM Serial Numbers
    const isGeneric = ['na', 'n/a', 'none', '—', '-', 'null', ''].includes(serial.toLowerCase());
    if (serial && !isGeneric) {
      const snKey = serial.toLowerCase();
      if (seenSerials.has(snKey)) {
        alert(`❌ Duplicate Serial Number detected!\n\nUnit #${seenSerials.get(snKey)} and Unit #${uIdx} both have the same Serial Number "${serial}".\n\nEach physical equipment unit must have a unique Serial Number.`);
        $(`#ast_u_serial_${uIdx}`)?.focus();
        return;
      }
      seenSerials.set(snKey, uIdx);
    }

    units.push({
      serial_no: serial,
      asset_code: code,
      cost: cost,
      plant_location: loc
    });
  }

  // Check against all existing assets in the system
  const existingAssets = (window._allAssets && window._allAssets.length) ? window._allAssets : (D?.assets || []);
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (u.asset_code) {
      const match = existingAssets.find(x => String(x.asset_code || '').trim().toLowerCase() === u.asset_code.toLowerCase());
      if (match) {
        alert(`❌ Duplicate SAP Code!\n\nSAP Code "${u.asset_code}" (entered in Unit #${i + 1}) is already assigned to asset "${match.asset_name}" (Requisition: ${match.proc_code || 'PRC'}).\n\nPlease use a unique SAP Code.`);
        return;
      }
    }
    const isGeneric = ['na', 'n/a', 'none', '—', '-', 'null', ''].includes(u.serial_no.toLowerCase());
    if (u.serial_no && !isGeneric) {
      const match = existingAssets.find(x => String(x.serial_no || '').trim().toLowerCase() === u.serial_no.toLowerCase());
      if (match) {
        alert(`❌ Duplicate Serial Number!\n\nSerial Number "${u.serial_no}" (entered in Unit #${i + 1}) is already registered to asset "${match.asset_name}" (SAP Code: ${match.asset_code || 'NA'}).\n\nPlease verify and enter the unique Serial Number for this equipment.`);
        return;
      }
    }
  }

  const r = await api("POST", `/api/procs/${sel}/assets`, {
    po_id: poId,
    item_id: $("#ast_item_sel") ? (+$("#ast_item_sel").value || null) : null,
    asset_name: name,
    category: $("#ast_cat").value,
    capitalization_date: $("#ast_cap_date").value,
    commissioning_date: $("#ast_comm_date").value,
    plant_location: $("#ast_loc").value,
    custodian: $("#ast_cust").value,
    cost: +$("#ast_cost").value || 0,
    warranty_expiry: $("#ast_warranty").value,
    status: $("#ast_status").value,
    remarks: $("#ast_remarks").value,
    units: units
  });

  $("#asset_modal").remove();
  toast(`Successfully capitalized & tagged ${r.count || units.length} factory assets ✔`);
  load();
});

const saveEditAssetAction = (assetId) => T(async () => {
  const code = $("#east_code").value.trim();
  const serial = $("#east_serial").value.trim();

  // Check against all existing assets in system
  const existingAssets = (window._allAssets && window._allAssets.length) ? window._allAssets : (D?.assets || []);
  if (code) {
    const match = existingAssets.find(x => x.id !== assetId && String(x.asset_code || '').trim().toLowerCase() === code.toLowerCase());
    if (match) {
      alert(`❌ Duplicate SAP Code!\n\nSAP Code "${code}" is already assigned to asset "${match.asset_name}" (ID: ${match.id}).\n\nPlease use a unique SAP Code.`);
      $("#east_code")?.focus();
      return;
    }
  }

  const isGeneric = ['na', 'n/a', 'none', '—', '-', 'null', ''].includes(serial.toLowerCase());
  if (serial && !isGeneric) {
    const match = existingAssets.find(x => x.id !== assetId && String(x.serial_no || '').trim().toLowerCase() === serial.toLowerCase());
    if (match) {
      alert(`❌ Duplicate Serial Number!\n\nSerial Number "${serial}" is already registered to asset "${match.asset_name}" (SAP Code: ${match.asset_code || 'NA'}).\n\nEach physical equipment unit must have a unique Serial Number.`);
      $("#east_serial")?.focus();
      return;
    }

  await api("PUT", `/api/assets/${assetId}`, {
    asset_name: $("#east_name").value,
    asset_code: code,
    category: $("#east_cat").value,
    capitalization_date: $("#east_cap_date").value,

  const count = document.querySelectorAll('.asset-chk:checked').length;
  const btn = $('#btn_bulk_del_assets');

  if (span) span.textContent = count;
  if (btn) btn.style.display = count > 0 ? 'inline-flex' : 'none';

  openSecurityDeleteModal({

    entityType: "Factory Fixed Asset",
    entityCode: ast.asset_code,

    details: [
      { label: "Plant Location", value: ast.plant_location || 'Factory Floor' },
      { label: "Serial No", value: ast.serial_no || '—' }
    ],
    warning: "This will permanently remove this equipment record from the Fixed Asset Register.",
    actionButtonText: "🗑️ Delete Fixed Asset",
    onExecute: async ({ confirm, password }) => {
      await api("DELETE", `/api/assets/${assetId}`, { confirm, password });
      toast("Asset record deleted ✔");
      if (tab === 'asset_reg') renderAssetRegister(); else load();
    }
  });

function deleteSelectedAssets() {
  const chks = Array.from(document.querySelectorAll('.asset-chk:checked')).map(c => +c.value);
  if (!chks.length) return alert("No assets selected for deletion.");
  openSecurityDeleteModal({
    title: `Bulk Delete (${chks.length}) Selected Fixed Assets`,
    entityType: "Bulk Asset Batch",
    entityCode: `${chks.length} Assets Selected`,
    warning: `This will permanently remove ${chks.length} selected fixed asset records from the register.`,
    actionButtonText: `🗑️ Delete ${chks.length} Selected Assets`,
    onExecute: async ({ confirm, password }) => {
      for (const id of chks) {
        await api("DELETE", `/api/assets/${id}`, { confirm, password });
      }
      toast(`${chks.length} Assets deleted successfully ✔`);
      if (tab === 'asset_reg') renderAssetRegister(); else load();
    }
  });
}

function clearAllAssets() {
  const existingAssets = (window._allAssets && window._allAssets.length) ? window._allAssets : (D?.assets || []);
  if (!existingAssets.length) return alert("The Asset Register is already empty.");
  openSecurityDeleteModal({
    title: `Clear Entire Fixed Asset Register (${existingAssets.length} Records)`,
    entityType: "All Fixed Assets",
    entityCode: `Total: ${existingAssets.length} Assets`,
    warning: "CAUTION: This will permanently delete ALL fixed assets from the register. This action cannot be undone.",
    actionButtonText: `🗑️ Delete All ${existingAssets.length} Assets`,
    onExecute: async ({ confirm, password }) => {
      for (const a of existingAssets) {
        await api("DELETE", `/api/assets/${a.id}`, { confirm, password });
      }
      toast(`All ${existingAssets.length} assets removed from register ✔`);
      if (tab === 'asset_reg') renderAssetRegister(); else load();
    }
  });
}

        <div style="font-size:12px; color:#7f1d1d;">Deleting this item removes it from the central item master library. Existing requisitions using this item will preserve historical data.</div>

      <div id="del_dep_box" style="margin-bottom:14px; padding:10px 12px; border-radius:6px; background:#f8fafc; border:1px solid var(--bd); font-size:12px; color:var(--tx-sec);">

      </div>

      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:#334155;">Type "DELETE" to confirm permanent deletion *</label>
        <input id="del_sec_confirm" type="text" placeholder="Type DELETE in capital letters" style="width:100%; margin-bottom:4px;" oninput="validateDelSecInputs()" onkeydown="if(event.key==='Enter')$('#del_sec_password')?.focus()">
      </div>

      <div style="margin-bottom:14px;">
        <label style="display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:#334155;">Administrator Password *</label>
        <input id="del_sec_password" type="password" placeholder="Enter your administrator password" style="width:100%; margin-bottom:4px;" oninput="validateDelSecInputs()" onkeydown="if(event.key==='Enter')executeDeleteCatalogItem(${c.id})">
        <small style="color:#64748b; font-size:11px;">Password verification is enforced for SOX / ISO compliance security.</small>
      </div>

      <div id="del_sec_override_wrap" style="display:none; margin-bottom:14px; background:#fff1f2; border:1px solid #fecdd3; border-radius:6px; padding:8px 10px;">
        <label style="display:flex; align-items:center; gap:8px; font-size:12px; color:#991b1b; cursor:pointer;">
          <input type="checkbox" id="del_sec_force" onchange="validateDelSecInputs()">
          <b>I acknowledge this item is used in existing procurement records and authorize force deletion.</b>
        </label>
      </div>

      <div id="del_sec_error" style="display:none; color:#dc2626; font-size:12px; margin-bottom:10px; font-weight:600;"></div>

      <div class="row" style="justify-content:flex-end; gap:8px;">
        <button class="btn s" onclick="$('#cat_delete_security_modal').remove()">Cancel</button>
        <button id="del_sec_submit_btn" class="btn s r" disabled onclick="executeDeleteCatalogItem(${c.id})" style="background:#dc2626; color:#fff; font-weight:700;">
          🗑️ Authorize Permanent Delete
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  setTimeout(() => {
    const inp = document.getElementById('del_sec_confirm');
    if (inp) inp.focus();
  }, 100);

  try {
    const res = await api("GET", `/api/catalog/${cid}/usage`);
    window._delItemUsage = res;
    const box = document.getElementById('del_dep_box');
    const overrideWrap = document.getElementById('del_sec_override_wrap');
    if (box) {
      if (res && res.inUse) {
        box.style.background = '#fef2f2';
        box.style.border = '1px solid #fca5a5';
        box.style.color = '#991b1b';
        box.innerHTML = `⚠️ <b>Item is currently in use!</b> Linked to <b>${res.procCount || 0}</b> requisition(s) and <b>${res.poCount || 0}</b> Purchase Order(s). To proceed, check the override acknowledgement below.`;
        if (overrideWrap) overrideWrap.style.display = 'block';
      } else {
        box.style.background = '#f0fdf4';
        box.style.border = '1px solid #86efac';
        box.style.color = '#166534';
        box.innerHTML = `✔ <b>Safe to delete:</b> No active requisitions or purchase orders linked to this master item.`;
      }
    }
  } catch (err) {
    console.error("Usage check error:", err);
  }
}

function validateDelSecInputs() {
  const confirmVal = ($('#del_sec_confirm')?.value || '').trim();
  const passVal = ($('#del_sec_password')?.value || '').trim();
  const forceReq = window._delItemUsage && window._delItemUsage.inUse;
  const forceChecked = Boolean($('#del_sec_force')?.checked);
  const btn = $('#del_sec_submit_btn');
  if (!btn) return;

  const isConfirmed = confirmVal.toUpperCase() === 'DELETE';
  const isPassEntered = passVal.length > 0;
  const isForceOk = !forceReq || forceChecked;

  btn.disabled = !(isConfirmed && isPassEntered && isForceOk);
}

async function executeDeleteCatalogItem(cid) {
  const confirmVal = ($('#del_sec_confirm')?.value || '').trim();
  const password = ($('#del_sec_password')?.value || '').trim();
  const force = Boolean($('#del_sec_force')?.checked);
  const errBox = $('#del_sec_error');
  const btn = $('#del_sec_submit_btn');

  if (confirmVal.toUpperCase() !== 'DELETE') {
    if (errBox) { errBox.style.display = 'block'; errBox.innerText = 'Please type "DELETE" to confirm.'; }
    return;
  }
  if (!password) {
    if (errBox) { errBox.style.display = 'block'; errBox.innerText = 'Administrator password is required for security authorization.'; }
    return;
  }

  try {
    if (btn) { btn.disabled = true; btn.innerText = 'Authorizing Deletion...'; }
    if (errBox) errBox.style.display = 'none';

    await api("DELETE", `/api/catalog/${cid}`, { confirm: 'DELETE', password, force });
    $('#cat_delete_security_modal')?.remove();
    toast("Catalog item securely deleted and audit logged ✔");
    await load();
  } catch (err) {
    if (btn) { btn.disabled = false; btn.innerText = '🗑️ Authorize Permanent Delete'; }
    if (errBox) {
      errBox.style.display = 'block';
      errBox.innerText = err.message || 'Authorization failed.';
    }
  }
}

function onVendorGstInput(val) {
  val = (val || '').toUpperCase().trim();
  const panInp = $('#vm_pan');
  const stateInp = $('#vm_state');

  if (val.length >= 2 && stateInp && !stateInp.value) {
    const code = val.slice(0, 2);
    const gstStates = {
      '01':'Jammu & Kashmir', '02':'Himachal Pradesh', '03':'Punjab', '04':'Chandigarh',
      '05':'Uttarakhand', '06':'Haryana', '07':'Delhi', '08':'Rajasthan',
      '09':'Uttar Pradesh', '10':'Bihar', '11':'Sikkim', '12':'Arunachal Pradesh',
      '13':'Nagaland', '14':'Manipur', '15':'Mizoram', '16':'Tripura', '17':'Meghalaya',
      '18':'Assam', '19':'West Bengal', '20':'Jharkhand', '21':'Odisha', '22':'Chhattisgarh',
      '23':'Madhya Pradesh', '24':'Gujarat', '26':'Dadra & Nagar Haveli', '27':'Maharashtra',
      '29':'Karnataka', '30':'Goa', '31':'Lakshadweep', '32':'Kerala', '33':'Tamil Nadu',
      '34':'Puducherry', '35':'Andaman & Nicobar', '36':'Telangana', '37':'Andhra Pradesh', '38':'Ladakh'
    };
    if (gstStates[code]) {
      stateInp.value = gstStates[code];
    }
  }

  if (val.length >= 12 && panInp) {
    const derivedPan = val.slice(2, 12);
    if (!panInp.value || panInp.dataset.autoFilled === 'true') {
      panInp.value = derivedPan;
      panInp.dataset.autoFilled = 'true';
    }
  }
}

              <option value="45 days (MSME)" ${v.payment_terms === '45 days (MSME)' ? 'selected' : ''}>45 days (MSME Statutory)</option>
              <option value="60 days" ${v.payment_terms === '60 days' ? 'selected' : ''}>60 days net</option>
              <option value="Immediate / Advance" ${v.payment_terms === 'Immediate / Advance' ? 'selected' : ''}>Immediate / 100% Advance</option>
              <option value="50% Advance, 50% on Delivery" ${v.payment_terms === '50% Advance, 50% on Delivery' ? 'selected' : ''}>50% Advance, 50% on Delivery</option>
            </select>
          </div>
          <div>
            <label>Performance Rating</label>
            <select id="vm_rating">
              <option value="5.0" ${(+v.rating === 5.0) ? 'selected' : ''}>⭐⭐⭐⭐⭐ 5.0 (Exceptional)</option>
              <option value="4.8" ${(+v.rating === 4.8 || !v.rating) ? 'selected' : ''}>⭐⭐⭐⭐½ 4.8 (Preferred)</option>
              <option value="4.5" ${(+v.rating === 4.5) ? 'selected' : ''}>⭐⭐⭐⭐½ 4.5 (Standard Approved)</option>
              <option value="4.0" ${(+v.rating === 4.0) ? 'selected' : ''}>⭐⭐⭐⭐ 4.0 (Acceptable)</option>
              <option value="3.5" ${(+v.rating === 3.5) ? 'selected' : ''}>⭐⭐⭐½ 3.5 (Conditional)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row" style="justify-content:flex-end; gap:8px;">
        <button class="btn" onclick="$('#vendor_form_modal').remove()">Cancel</button>
        <button class="btn p" id="vm_submit_btn" onclick="saveVendorModalData(${Boolean(isEdit)}, ${vid || 'null'})">
          ${isEdit ? '💾 Update Vendor Master' : '＋ Save Vendor to Master'}
        </button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function saveVendorModalData(isEdit, vid) {
  const errBox = $('#vm_err_box');
  const btn = $('#vm_submit_btn');
  if (errBox) errBox.style.display = 'none';

  const name = ($('#vm_name')?.value || '').trim();
  if (!name) {
    if (errBox) {
      errBox.innerText = 'Vendor / Enterprise legal name is required.';
      errBox.style.display = 'block';
    }
    $('#vm_name')?.focus();
    return;
  }

  const gst = ($('#vm_gst')?.value || '').toUpperCase().trim();
  const pan = ($('#vm_pan')?.value || '').toUpperCase().trim();
  const contact = ($('#vm_contact')?.value || '').trim();
  const phone = ($('#vm_phone')?.value || '').trim();
  const email = ($('#vm_email')?.value || '').trim();
  const address = ($('#vm_address')?.value || '').trim();
  const city = ($('#vm_city')?.value || '').trim();
  const state = ($('#vm_state')?.value || '').trim();
  const pincode = ($('#vm_pincode')?.value || '').trim();
  const msme_type = $('#vm_msme_type')?.value || 'None';
  const msme_no = ($('#vm_msme_no')?.value || '').trim();
  const bank_name = ($('#vm_bank_name')?.value || '').trim();
  const bank_ac = ($('#vm_bank_ac')?.value || '').trim();
  const ifsc = ($('#vm_ifsc')?.value || '').toUpperCase().trim();
  const payment_terms = $('#vm_payment_terms')?.value || '30 days';
  const rating = +$('#vm_rating')?.value || 4.5;

  const payload = {
    name, contact, phone, email, gst, pan,
    address, city, state, pincode,
    msme_type, msme_no, bank_name, bank_ac, ifsc,
    payment_terms, rating
  };

  try {
    if (btn) { btn.disabled = true; btn.innerText = isEdit ? 'Updating Vendor Master...' : 'Registering Vendor...'; }
    let res;
    if (isEdit && vid) {
      res = await api("PUT", `/api/vendors/${vid}`, payload);
      toast(`Vendor "${name}" updated successfully ✔`);
    } else {
      res = await api("POST", `/api/vendors`, payload);
      toast(`Vendor "${name}" registered successfully ✔`);
    }

    $('#vendor_form_modal')?.remove();
    await load();
    if (tab === 'vend') renderVendorsView();

    const createdId = res?.id || vid;
    if (typeof window._vendorAddCallback === 'function') {
      const cb = window._vendorAddCallback;
      window._vendorAddCallback = null;
      cb(createdId);
    }
  } catch (err) {
    if (btn) { btn.disabled = false; btn.innerText = isEdit ? '💾 Update Vendor Master' : '＋ Save Vendor to Master'; }
    if (errBox) {
      errBox.innerText = err.message || 'Failed to save vendor. Please verify details and try again.';
      errBox.style.display = 'block';
    } else {
      alert(err.message || 'Failed to save vendor.');
    }
  }
}

function openImportVendorModal() {
  const modal = document.createElement("div");
  modal.className = "modal-backdrop";
  modal.id = "imp_vendor_modal";
  modal.innerHTML = `
    <div class="modal-card">
      <h3 style="margin:0 0 12px;">Import Vendors from Excel / CSV</h3>
      <p style="font-size:12px; color:var(--tx-mut);">Copy and paste rows from Excel. Columns: <b>Vendor Name, Address, GSTIN, Contact Person, Phone, Email</b></p>
      <textarea id="paste_vend" rows="5" placeholder="Paste tab-separated or comma-separated rows here…"></textarea>
      <div class="row" style="justify-content:flex-end; margin-top:12px;">
        <button class="btn" onclick="$('#imp_vendor_modal').remove()">Cancel</button>
        <button class="btn p" onclick="executeVendorImport()">Import Data</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

const executeVendorImport = () => T(async () => {
  const raw = $("#paste_vend").value.trim();
  if (!raw) return alert("Please paste data to import.");
  const lines = raw.split(/\r?\n/);
  let imported = 0;
  for (const line of lines) {
    const parts = line.split(/[\t,]/).map(s => s.trim().replace(/^"|"$/g, ''));
    if (parts[0]) {
      await api("POST", "/api/vendors", {
        name: parts[0],
        address: parts[1] || "",
        gst: parts[2] || "",
        contact: parts[3] || "",
        phone: parts[4] || "",
        email: parts[5] || ""
      });
      imported++;
    }
  }
  $("#imp_vendor_modal").remove();
  toast(`${imported} vendors imported successfully ✔`);
  load();
});

function loadDemoPrompt() {
  if (confirm("Load full enterprise demo data package? This will populate requisitions, vendors, quotes, and audit logs.")) {

const copyAsNew = id => T(async () => {
  const p = L.find(x => x.id === id);
  if (!p) return;
  const newTitle = prompt("Enter Title for duplicate requisition:", p.title + " (Copy)");
  if (!newTitle) return;
  const res = await api("POST", "/api/procs", {
    type: p.type,
    kind: p.kind,
    title: newTitle,
    dept: p.dept,
    location: p.location,
    est: p.est,
    priority: p.priority || 'normal',
    copy_from: id
  });
  toast("Requisition duplicated successfully ✔");
  openReq(res.id);
});

  openSecurityDeleteModal({
    title: "Security Authorization: Delete Requisition",

    warning: "Deleting this requisition permanently purges all line items, vendor quotations, approvals, attached documents, and audit logs.",
    confirmWord: "DELETE",
