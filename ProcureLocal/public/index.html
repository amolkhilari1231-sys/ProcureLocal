<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MIS Procurement Enterprise – Procurement &amp; ERP Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-alt: #f1f5f9;
      --tx: #0f172a;
      --tx-sec: #475569;
      --tx-mut: #64748b;
      --bd: #e2e8f0;
      --bd-dark: #cbd5e1;
      --pr: #2563eb;
      --pr-dark: #1d4ed8;
      --pr-light: #eff6ff;
      --ok: #16a34a;
      --ok-light: #dcfce7;
      --wn: #d97706;
      --wn-light: #fef3c7;
      --er: #dc2626;
      --er-light: #fee2e2;
      --nav-bg: #0f172a;
      --nav-hover: #1e293b;
      --nav-active: #334155;
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
      --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.08), 0 2px 4px -2px rgba(15,23,42,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15,23,42,0.1), 0 4px 6px -4px rgba(15,23,42,0.05);
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--tx); -webkit-font-smoothing: antialiased; }

    /* Layout */
    .app { display: flex; min-height: 100vh; }
    aside { width: 250px; flex: none; background: var(--nav-bg); color: #cbd5e1; display: flex; flex-direction: column; padding: 18px 12px; position: sticky; top: 0; height: 100vh; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; }
    .brand-logo { width: 34px; height: 34px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 8px; display: grid; place-items: center; font-size: 18px; color: #fff; font-weight: 800; box-shadow: 0 2px 8px rgba(37,99,235,0.4); }
    .brand-text b { display: block; color: #fff; font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
    .brand-text small { color: #94a3b8; font-size: 10.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 165px; }

    .new-btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; font: 600 13px inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(37,99,235,0.3); transition: all 0.15s; }
    .new-btn:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); transform: translateY(-1px); }

    .nav-sec-title { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.08em; padding: 10px 10px 4px; }
    aside a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 7px; color: #cbd5e1; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.12s, color 0.12s; margin-bottom: 2px; }
    aside a:hover { background: var(--nav-hover); color: #fff; }
    aside a.on { background: var(--nav-active); color: #fff; font-weight: 600; }
    aside a svg { width: 17px; height: 17px; stroke-width: 2; opacity: 0.85; flex: none; }
    aside a.on svg { opacity: 1; stroke: #60a5fa; }
    .cnt { margin-left: auto; background: var(--wn); color: #fff; border-radius: 99px; font-size: 10.5px; font-weight: 700; padding: 1px 7px; line-height: 1.4; }

    .user-footer { margin-top: auto; padding: 10px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11.5px; display: flex; flex-direction: column; gap: 6px; }
    .user-pill { display: flex; align-items: center; gap: 9px; }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: #3b82f6; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
    .user-info b { display: block; color: #fff; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .user-info small { color: #94a3b8; font-size: 10.5px; }
    .user-actions { display: flex; gap: 10px; font-size: 11px; margin-top: 4px; }
    .user-actions a { color: #94a3b8; cursor: pointer; text-decoration: underline; padding: 0; }
    .user-actions a:hover { color: #fff; }

    /* Main Area */
    .mw { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    header.top-bar { display: flex; align-items: center; gap: 14px; padding: 12px 28px; background: #fff; border-bottom: 1px solid var(--bd); position: sticky; top: 0; z-index: 15; box-shadow: var(--shadow-sm); }
    .page-title { flex: 1; }
    .page-title h1 { font-size: 18px; margin: 0; font-weight: 700; color: var(--tx); letter-spacing: -0.3px; }
    .page-title .breadcrumb { font-size: 11px; color: var(--tx-mut); margin-bottom: 1px; }

    .search-input-wrap { position: relative; width: 320px; }
    .search-input-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--tx-mut); }
    .search-input-wrap input { padding-left: 32px; font-size: 12.5px; border-radius: 8px; border: 1px solid var(--bd); }

    main { padding: 22px 28px 80px; max-width: 1400px; width: 100%; margin: 0 auto; }

    /* Cards & Containers */
    .card { background: var(--card); border: 1px solid var(--bd); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .card-header h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--tx); display: flex; align-items: center; gap: 8px; }
    .card-header p { margin: 2px 0 0; font-size: 12px; color: var(--tx-mut); }
    .card.act { border: 2px solid var(--pr); box-shadow: 0 0 0 1px var(--pr); }

    /* Grid Layouts */
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 16px; }

    /* KPI metric cards */
    .kpi { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; margin-bottom: 0; position: relative; overflow: hidden; border-left: 4px solid #cbd5e1; }
    .kpi.p { border-left-color: var(--pr); }
    .kpi.g { border-left-color: var(--ok); }
    .kpi.w { border-left-color: var(--wn); }
    .kpi.r { border-left-color: var(--er); }
    .kpi span { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--tx-mut); }
    .kpi b { display: block; font-size: 26px; font-weight: 800; line-height: 1.15; margin: 4px 0 2px; color: var(--tx); }
    .kpi small { font-size: 11px; color: var(--tx-mut); }
    .kpi-icon { width: 44px; height: 44px; border-radius: 10px; background: var(--bg); display: grid; place-items: center; color: var(--tx-sec); }

    /* Buttons */
    .btn { border: 1px solid var(--bd-dark); background: #fff; color: var(--tx); padding: 7px 14px; border-radius: 7px; cursor: pointer; font: 500 13px inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.12s; }
    .btn:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn.p { background: var(--pr); color: #fff; border-color: var(--pr); }
    .btn.p:hover { background: var(--pr-dark); }
    .btn.g { background: var(--ok); color: #fff; border-color: var(--ok); }
    .btn.g:hover { background: #15803d; }
    .btn.r { background: var(--er); color: #fff; border-color: var(--er); }
    .btn.r:hover { background: #b91c1c; }
    .btn.s { padding: 4px 9px; font-size: 11.5px; border-radius: 5px; }
    .btn.big { padding: 10px 18px; font-size: 13.5px; font-weight: 600; }
    .btn.wide { width: 100%; justify-content: center; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Tables */
    .tw { overflow-x: auto; margin: 0 -20px -18px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--bd); vertical-align: middle; }
    th { color: var(--tx-sec); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; background: #f8fafc; white-space: nowrap; border-top: 1px solid var(--bd); }
    tr.c { cursor: pointer; transition: background 0.1s; }
    tr.c:hover td { background: #f1f5f9; }
    .num { text-align: right; }
    .center { text-align: center; }

    /* Tags & Badges */
    .tag { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    .b-blue { background: #dbeafe; color: #1e40af; }
    .b-green { background: #dcfce7; color: #15803d; }
    .b-amber { background: #fef3c7; color: #b45309; }
    .b-red { background: #fee2e2; color: #b91c1c; }
    .b-gray { background: #f1f5f9; color: #475569; }
    .b-purple { background: #ede9fe; color: #6d28d9; }

    /* Form Inputs */
    input, select, textarea { font: inherit; padding: 7px 11px; border: 1px solid var(--bd-dark); border-radius: 7px; background: #fff; color: var(--tx); width: 100%; font-size: 13px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--pr); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    input[type=checkbox] { width: auto; cursor: pointer; }
    input:disabled, select:disabled, textarea:disabled { background: #f8fafc; color: var(--tx-mut); cursor: not-allowed; }
    .f { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label { font-size: 11.5px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* Pipeline Step Tracker */
    .stp { display: flex; overflow-x: auto; margin: 12px 0 16px; background: #fff; border: 1px solid var(--bd); border-radius: 10px; padding: 12px 14px; gap: 4px; }
    .stp-item { flex: 1; min-width: 95px; text-align: center; position: relative; font-size: 11px; color: var(--tx-mut); }
    .stp-item i { width: 26px; height: 26px; border-radius: 50%; background: #e2e8f0; display: grid; place-items: center; margin: 0 auto 5px; font-style: normal; font-weight: 700; font-size: 11px; color: #64748b; z-index: 2; position: relative; transition: all 0.2s; }
    .stp-item:not(:first-child)::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: #e2e8f0; z-index: 1; }
    .stp-item.done::before { background: var(--ok); }
    .stp-item.done i { background: var(--ok); color: #fff; }
    .stp-item.cur::before { background: var(--ok); }
    .stp-item.cur i { background: var(--pr); color: #fff; box-shadow: 0 0 0 4px #bfdbfe; font-size: 12px; }
    .stp-item.cur { color: var(--tx); font-weight: 700; }

    /* Action Banner */
    .banner { border: 2px solid var(--pr); background: linear-gradient(to right, #eff6ff, #f8faff); padding: 18px 22px; border-radius: var(--radius); margin-bottom: 16px; }
    .banner .step-badge { font-size: 10px; font-weight: 800; color: var(--pr); text-transform: uppercase; letter-spacing: 0.08em; display: inline-block; margin-bottom: 2px; }
    .banner h2 { margin: 2px 0 6px; font-size: 19px; color: var(--tx); font-weight: 800; }
    .chk { list-style: none; padding: 0; margin: 10px 0; display: flex; flex-direction: column; gap: 4px; }
    .chk li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
    .chk li.y { color: var(--ok); font-weight: 600; }
    .chk li.n { color: var(--tx-mut); }

    /* Tabs */
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--bd); margin: 6px 0 16px; overflow-x: auto; }
    .tabs button { border: 0; background: none; padding: 9px 16px; cursor: pointer; font: 600 13px inherit; color: var(--tx-mut); border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; transition: color 0.12s, border-color 0.12s; display: flex; align-items: center; gap: 6px; }
    .tabs button:hover { color: var(--tx); }
    .tabs button.on { color: var(--pr); border-color: var(--pr); }
    .tabs em { font-style: normal; background: #e2e8f0; border-radius: 99px; padding: 1px 7px; font-size: 10.5px; font-weight: 700; }
    .tabs button.on em { background: #dbeafe; color: #1e40af; }

    /* CST Matrix Table */
    .cst-table th.vend { background: #0f172a; color: #fff; text-align: center; border-left: 1px solid #334155; }
    .cst-table td.l1 { background: #f0fdf4; font-weight: 700; color: #166534; }
    .cst-table td.l2 { background: #fefce8; color: #854d0e; }
    .cst-table td.l3 { background: #fef2f2; color: #991b1b; }

    /* Modals */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(3px); z-index: 99; display: grid; place-items: center; padding: 20px; }
    .modal-card { background: #fff; border-radius: 12px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow-lg); animation: pop 0.15s ease-out; }
    @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Toast */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999; box-shadow: var(--shadow-lg); }
    #toast.show { opacity: 1; }

    /* Login Screen */
    .login-wrap { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #1e3a8a, #0f172a); padding: 20px; }
    .login-box { background: #fff; border-radius: 14px; width: 100%; max-width: 380px; padding: 36px 30px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
    .login-logo { width: 50px; height: 50px; border-radius: 12px; background: linear-gradient(135deg,#3b82f6,#1d4ed8); display: grid; place-items: center; font-size: 24px; color: #fff; margin: 0 auto 14px; }

    @media (max-width: 860px) {
      .app { flex-direction: column; }
      aside { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script>
// Automated Desktop Lifecycle Heartbeat
setInterval(() => {
  fetch('/api/heartbeat', { method: 'POST', keepalive: true }).catch(() => {});
}, 8000);
try { fetch('/api/heartbeat', { method: 'POST', keepalive: true }).catch(() => {}); } catch(e) {}

async function exitDesktopApp() {
  const appTitle = (typeof SET !== 'undefined' && SET && SET.app_name) ? SET.app_name : 'MIS Procurement';
  if (confirm("Close " + appTitle + " and stop background server?")) {
    try { await fetch('/api/shutdown', { method: 'POST' }); } catch {}
    window.close();
    document.body.innerHTML = `
      <div style="display:flex; height:100vh; align-items:center; justify-content:center; background:#0f172a; color:#fff; font-family:sans-serif; text-align:center;">
        <div>
          <div style="font-size:48px; margin-bottom:12px;">🛑</div>
          <h2>${esc(appTitle)} has shut down</h2>
          <p style="color:#94a3b8;">Background services have been safely stopped. You may now close this window.</p>
        </div>
      </div>
    `;
  }
}

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nl = t => esc(t ?? "").replace(/\n/g, "<br>");
const dmy = d => {
  if (!d) return "";
  const parts = String(d).slice(0, 10).split(/[-./]/);
  if (parts.length === 3) {
    if (parts[0].length === 4) return `${parts[2]}.${parts[1]}.${parts[0]}`;
    return `${parts[0]}.${parts[1]}.${parts[2]}`;
  }
  return String(d);
};
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dt = s => s ? new Date(s).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "";
const td = () => new Date().toISOString().slice(0, 10);
const days = d => Math.ceil((new Date(d) - new Date(td())) / 864e5);
const gt = (r, g) => (Number(r) || 0) * (1 + (Number(g) || 0) / 100);

const SL = {
  quotations: "1. Quotations",
  negotiation: "2. Negotiation",
  final: "3. Final Quotations",
  pr: "4. SAP PR",
  logic: "5. Logic Note",
  hod: "6. HOD Sign",
  commercial: "7. Commercial",
  approvals: "8. SAP Approvals",
  order: "9. PO / SO Order",
  completed: "Completed ✔"
};

let U, ROLES, SET, FLOW, L = [], V = [], CAT = [], ANALYTICS = {}, tab = "dash", sel = null, D = null, filt = { q: "", stage: "", type: "", dept: "", show: "active" }, rtab = "ov", QE = null;

// API Helper
async function api(m, u, b) {
  let r;
  try {
    r = await fetch(u, {
      method: m,
      headers: b ? { "Content-Type": "application/json" } : {},
      body: b ? JSON.stringify(b) : undefined
    });
  } catch (err) {
    if (err.name === 'TypeError' || (err.message && err.message.toLowerCase().includes('fetch'))) {
      throw new Error("Cannot connect to ProcureLocal server. Please ensure the backend server is running on port " + (location.port || 3002) + ".");
    }
    throw err;
  }
  let j = {};
  try { j = await r.json(); } catch {}
  if (r.status === 401 && u !== "/api/login" && u !== "/api/me") {
    location.reload();
    return new Promise(() => {});
  }
  if (!r.ok) throw new Error(j.error || ("Request failed (" + r.status + ")"));
  return j;
}

const T = async f => {
  try { await f(); } catch (e) { alert(e.message); }
};

const toast = m => {
  let e = $("#toast");
  if (!e) {
    e = document.createElement("div");
    e.id = "toast";
    document.body.appendChild(e);
  }
  e.textContent = m;
  e.className = "show";
  clearTimeout(window._tt);
  window._tt = setTimeout(() => (e.className = ""), 2200);
};

// Lifecycle Boot
async function boot() {
  try {
    const m = await api("GET", "/api/me");
    U = m.user;
    ROLES = m.roles;
    SET = m.settings;
    FLOW = m.flow;
    await load();
    startAutoRefresh();
  } catch {
    loginView();
  }
}

async function load() {
  window._dossierCache = {};
  const [procs, vendors, catalog, analytics] = await Promise.all([
    api("GET", "/api/procs"),
    api("GET", "/api/vendors"),
    api("GET", "/api/catalog"),
    api("GET", "/api/analytics")
  ]);
  L = procs;
  V = vendors;
  CAT = catalog;
  ANALYTICS = analytics;
  if (sel) {
    D = await api("GET", "/api/procs/" + sel).catch(() => null);
  }
  render();
}

const isLocked = p => Boolean(p && (p.stage === 'completed' || Number(p.is_locked) === 1) && p.unlock_status !== 'unlocked');
const can = () => {
  if (!U || U.role === 'viewer') return false;
  // Strict Audit Lock: When a requisition is completed or locked, direct modifications are blocked for ALL users until unlocked with Admin permission
  if (sel && D && D.p && isLocked(D.p)) return false;
  if (adm()) return true;
  return true;
};
const adm = () => U && U.role === "admin";
const canApproveUnlock = () => adm() || (U && (U.role === 'commercial' || U.role === 'approver' || U.role === 'finance'));
const rw = () => can() ? "" : "disabled";

// ---- Global Security Authorization Delete System (SOX / ISO Enterprise Compliance) ----
function openSecurityDeleteModal(opts) {
  if (!adm()) return alert("Permission Denied: Only Administrator accounts can authorize deletions.");

  const existing = document.getElementById('security_delete_modal');
  if (existing) existing.remove();

  const title = opts.title || "Security Authorization: Delete Record";
  const entityType = opts.entityType || "Record";
  const entityCode = opts.entityCode || "";
  const entityName = opts.entityName || "";
  const details = opts.details || [];
  const warning = opts.warning || "This action is permanent and cannot be undone. Associated records and documents will be permanently removed.";
  const requirePassword = opts.requirePassword !== false;
  const confirmWord = (opts.confirmWord || "DELETE").toUpperCase();
  const actionButtonText = opts.actionButtonText || "🗑️ Authorize Permanent Delete";

  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.id = 'security_delete_modal';
  modal.innerHTML = `
    <div class="modal-card" style="max-width:540px; border-top: 4px solid #dc2626;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; border-bottom:1px solid var(--bd); padding-bottom:10px;">
        <div>
          <h3 style="margin:0; color:#dc2626; display:flex; align-items:center; gap:8px;">
            <span>🛡️ ${esc(title)}</span>
            <span class="tag b-red" style="font-size:10px; padding:2px 6px;">ADMIN ONLY</span>
          </h3>
          <p style="margin:2px 0 0; font-size:12px; color:var(--tx-mut);">Strict Audit Security Authorization Required</p>
        </div>
        <button class="btn s" onclick="$('#security_delete_modal').remove()">✕</button>
      </div>

      <!-- Entity Summary Card -->
      <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:12px; margin-bottom:14px; font-size:12px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
          <span style="color:#64748b;">Entity Classification:</span>

      </div>

          ${esc(actionButtonText)}
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  setTimeout(() => {
    const inp = document.getElementById('sec_del_confirm_inp');
    if (inp) inp.focus();
  }, 100);

  const submitBtn = document.getElementById('sec_del_submit_btn');
  submitBtn.onclick = async () => {
    const confirmVal = ($('#sec_del_confirm_inp')?.value || '').trim();
    const passVal = ($('#sec_del_password_inp')?.value || '').trim();
    const errBox = $('#sec_del_err_msg');

    if (confirmVal.toUpperCase() !== confirmWord) {
      if (errBox) { errBox.style.display = 'block'; errBox.innerText = `Please type "${confirmWord}" to confirm.`; }
      return;
    }
    if (requirePassword && !passVal) {
      if (errBox) { errBox.style.display = 'block'; errBox.innerText = 'Administrator password is required.'; }
      return;
    }

    try {
      submitBtn.disabled = true;
      submitBtn.innerText = 'Authorizing & Deleting...';
      if (errBox) errBox.style.display = 'none';

      await opts.onExecute({ confirm: confirmVal, password: passVal });
      $('#security_delete_modal')?.remove();
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.innerText = actionButtonText;
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerText = err.message || 'Security verification failed.';
      }
    }
  };
}

function toggleSecDelPassVisibility() {
  const inp = document.getElementById('sec_del_password_inp');
  if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
}

function validateSecDelModal(confirmWord) {
  const confirmVal = ($('#sec_del_confirm_inp')?.value || '').trim();
  const passInp = $('#sec_del_password_inp');
  const passVal = passInp ? (passInp.value || '').trim() : 'dummy';
  const btn = $('#sec_del_submit_btn');
  if (!btn) return;

  const isConfirmed = confirmVal.toUpperCase() === confirmWord.toUpperCase();
  const isPassEntered = !passInp || passVal.length > 0;
  btn.disabled = !(isConfirmed && isPassEntered);
}

  if (el) {

}

async function searchClientFallback(query) {
  const qLower = (query || '').toLowerCase().trim();
  if (!qLower) return [];
  let procs = L || [];
  if (!procs || !procs.length) {
    try {
      procs = await api("GET", "/api/procs");
      L = procs;
    } catch (e) {
      procs = [];
    }
  }
  const results = [];

  window._dossierCache = window._dossierCache || {};

  for (const p of procs) {
    let detail = window._dossierCache[p.id];
    if (!detail) {
      try {
        detail = await api("GET", "/api/procs/" + p.id);
        window._dossierCache[p.id] = detail;
      } catch (e) {
        continue;
      }
    }
    if (!detail) continue;

    const matches = [];
    function addMatch(tag, val, highlight) {
      if (!val) return;
      if (!matches.some(m => m.tag === tag && String(m.value).toLowerCase() === String(val).toLowerCase())) {
        matches.push({ tag, value: String(val), highlight: !!highlight });
      }
    }

    // 1. Check proc fields
    if (p.code && p.code.toLowerCase().includes(qLower)) addMatch('Requisition Code', p.code, true);
    if (p.title && p.title.toLowerCase().includes(qLower)) addMatch('Title', p.title, true);
    if (p.dept && p.dept.toLowerCase().includes(qLower)) addMatch('Department', p.dept, false);
    if (p.location && p.location.toLowerCase().includes(qLower)) addMatch('Location', p.location, false);
    if (p.po_no && p.po_no.toLowerCase().includes(qLower)) addMatch('Purchase Order', p.po_no, true);
    if (p.asset_code && p.asset_code.toLowerCase().includes(qLower)) addMatch('SAP Asset Code', p.asset_code, true);
    if (p.vendor_name && p.vendor_name.toLowerCase().includes(qLower)) addMatch('Awarded Vendor', p.vendor_name, true);
    if (p.pr_no && p.pr_no.toLowerCase().includes(qLower)) addMatch('PR Number', p.pr_no, true);

    // 2. Check items
    (detail.items || []).forEach(it => {
      if (it.name && it.name.toLowerCase().includes(qLower)) addMatch('Item Name', it.name, true);
      if (it.model && it.model.toLowerCase().includes(qLower)) addMatch('Model / Spec', it.model, true);
      if (it.descr && it.descr.toLowerCase().includes(qLower)) addMatch('Description', it.descr, false);
      if (it.sap_no && it.sap_no.toLowerCase().includes(qLower)) addMatch('SAP Material Code', it.sap_no, true);
      if (it.asset_code && it.asset_code.toLowerCase().includes(qLower)) addMatch('SAP Asset Code', it.asset_code, true);
    });

    // 3. Check assets
    (detail.assets || []).forEach(a => {
      if (a.asset_code && a.asset_code.toLowerCase().includes(qLower)) addMatch('SAP Asset Code', a.asset_code, true);
      if (a.serial_no && a.serial_no.toLowerCase().includes(qLower)) addMatch('OEM Serial No', a.serial_no, true);
      if (a.asset_name && a.asset_name.toLowerCase().includes(qLower)) addMatch('Asset Name', a.asset_name, true);
      if (a.custodian && a.custodian.toLowerCase().includes(qLower)) addMatch('Custodian', a.custodian, false);
      if (a.plant_location && a.plant_location.toLowerCase().includes(qLower)) addMatch('Asset Location', a.plant_location, false);
    });

    // 4. Check invoices
    (detail.invoices || []).forEach(inv => {
      if (inv.invoice_no && inv.invoice_no.toLowerCase().includes(qLower)) addMatch('Vendor Invoice No', inv.invoice_no, true);
      if (inv.utr_no && inv.utr_no.toLowerCase().includes(qLower)) addMatch('Payment UTR No', inv.utr_no, true);
      if (inv.remarks && inv.remarks.toLowerCase().includes(qLower)) addMatch('Invoice Remarks', inv.remarks, false);
    });

    // 5. Check pos
    (detail.pos || []).forEach(po => {
      if (po.po_no && po.po_no.toLowerCase().includes(qLower)) addMatch('PO Number', po.po_no, true);
      if (po.vendor_name && po.vendor_name.toLowerCase().includes(qLower)) addMatch('PO Vendor', po.vendor_name, true);
      if (po.remarks && po.remarks.toLowerCase().includes(qLower)) addMatch('PO Remarks', po.remarks, false);
    });

    // 6. Check grns
    (detail.grns || []).forEach(g => {
      if (g.grn_no && g.grn_no.toLowerCase().includes(qLower)) addMatch('GRN / Inward No', g.grn_no, true);
      if (g.challan_no && g.challan_no.toLowerCase().includes(qLower)) addMatch('Delivery Challan No', g.challan_no, true);
      if (g.vehicle_no && g.vehicle_no.toLowerCase().includes(qLower)) addMatch('Vehicle No', g.vehicle_no, false);
    });

    // 7. Check quotes & vendors
    (detail.quotes || []).forEach(q => {
      if (q.vendor && q.vendor.toLowerCase().includes(qLower)) addMatch('Quotation Vendor', q.vendor, true);
    });

    // 8. Check documents
    (detail.docs || []).forEach(d => {
      if (d.name && d.name.toLowerCase().includes(qLower)) addMatch('Attached Document', d.name, true);
    });

    if (matches.length > 0) {
      results.push({
        procId: p.id,
        proc: detail.p || p,
        isLocked: isLocked(detail.p || p),
        matches: matches,
        items: detail.items || [],
        pos: detail.pos || [],
        grns: detail.grns || [],
        invoices: detail.invoices || [],
        assets: detail.assets || [],
        quotesCount: (detail.quotes || []).length,
        docsCount: (detail.docs || []).length
      });
    }
  }

  return results;
}

async function executeDashSearch(query) {
  query = (query || '').trim();
  if (!query) {
    clearDashSearch();
    return;
  }
  window._dashSearchQuery = query;
  window._dashSearching = true;

  const filterKey = window._dashSearchFilter || 'all';

  const container = document.getElementById('dash_search_results_container');
  if (container) {
    container.innerHTML = renderDashSearchResultsHtml();
  }

  try {
    const results = await api("GET", `/api/search?q=${encodeURIComponent(query)}&type=${encodeURIComponent(filterKey)}`);
    window._dashSearchResults = results || [];
  } catch (err) {
    // If backend returns 404 / API endpoint not found (e.g. background node service hasn't restarted yet),
    // instantly and seamlessly execute the client-side 360 search without any user alert errors!
    try {
      const fallbackResults = await searchClientFallback(query);
      window._dashSearchResults = fallbackResults || [];
    } catch (fallbackErr) {
      window._dashSearchResults = [];
      console.error("Search fallback error:", fallbackErr);
    }
  } finally {
    window._dashSearching = false;
    const container = document.getElementById('dash_search_results_container');
    if (container) {
      container.innerHTML = renderDashSearchResultsHtml();
    }
  }
}

function triggerGlobal360Search(query) {
  query = (query || '').trim();
  if (!query) return;
  window._dashSearchQuery = query;
  if (tab !== 'dash' || sel) {
    sel = null;
    tab = 'dash';
    render();
  }
  executeDashSearch(query);
}

// ---- Automatic Real-time Silent Polling & Window Focus Updates ----
async function loadSilent() {
  if (!U || document.hidden) return;
  const hasActiveModal = !!document.querySelector('.modal-backdrop, #new_modal, #security_delete_modal, #asset_label_modal, #custom_form_modal, #unlock_request_modal, #admin_direct_unlock_modal');
  const activeEl = document.activeElement;
  const isTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable);

  try {
    const [procs, analytics] = await Promise.all([
      api("GET", "/api/procs"),
      api("GET", "/api/analytics")
    ]);

    const changed = JSON.stringify(procs) !== JSON.stringify(L) || JSON.stringify(analytics) !== JSON.stringify(ANALYTICS);
    L = procs;
    ANALYTICS = analytics;

    const badge = document.getElementById('dash_live_badge');
    if (badge) {
      badge.textContent = `● Live Sync: ${new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    }

    if (changed) {
      if (tab === 'dash' && !sel && !hasActiveModal) {
        const searchInput = document.getElementById('dash_global_search');
        const curQuery = searchInput ? searchInput.value : (window._dashSearchQuery || '');
        const hadFocus = (activeEl === searchInput);

        render();

        if (curQuery) {
          const newSearchInput = document.getElementById('dash_global_search');
          if (newSearchInput) {
            newSearchInput.value = curQuery;
            if (hadFocus) newSearchInput.focus();
          }
        }
      } else if (!isTyping && !hasActiveModal && !sel) {
        render();
      }
    }
  } catch {
    // Quiet fail on network hiccup
  }
}

let _autoRefreshInterval = null;
function startAutoRefresh() {
  if (_autoRefreshInterval) clearInterval(_autoRefreshInterval);
  _autoRefreshInterval = setInterval(loadSilent, 12000); // 12 seconds auto-update
}

window.addEventListener('focus', () => {
  if (U) loadSilent();
});

function fmtDocSize(bytes) {
  if (!bytes || bytes <= 0) return '—';
  if (bytes > 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
  return (bytes / 1024).toFixed(1) + ' KB';
}

function getDocCategoryBadge(cat) {
  const c = String(cat || '').toLowerCase();
  if (c.includes('citpc')) return { cls: 'b-purple', label: 'IT CITPC Note' };
  if (c.includes('completion') || c.includes('cert')) return { cls: 'b-blue', label: 'Completion Certificate' };
  if (c.includes('quotation') || c.includes('quote')) return { cls: 'b-purple', label: 'Quotation' };
  if (c.includes('invoice') || c.includes('bill')) return { cls: 'b-green', label: 'Tax Invoice / Bill' };
  if (c.includes('purchaseorder') || c.includes('po')) return { cls: 'b-blue', label: 'Purchase Order' };
  if (c.includes('grn') || c.includes('challan')) return { cls: 'b-blue', label: 'Store Inward / DC' };
  if (c.includes('logic')) return { cls: 'b-amber', label: 'Sanction Logic Note' };
  if (c.includes('email') || c.includes('comm')) return { cls: 'b-cyan', label: 'Email / Negotiation' };
  if (c.includes('capex')) return { cls: 'b-purple', label: 'Capex Sanction Doc' };
  return { cls: 'b-gray', label: cat || 'Attachment' };
}

function getDocExtIcon(filename) {
  const ext = (filename || '').split('.').pop().toLowerCase();
  if (ext === 'pdf') return `<span style="background:#fee2e2; color:#b91c1c; font-weight:800; font-size:11px; padding:3px 6px; border-radius:4px; display:inline-block;">PDF</span>`;
  if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg'].includes(ext)) return `<span style="background:#dbeafe; color:#1d4ed8; font-weight:800; font-size:11px; padding:3px 6px; border-radius:4px; display:inline-block;">IMG</span>`;
  if (['html', 'htm'].includes(ext)) return `<span style="background:#fef3c7; color:#b45309; font-weight:800; font-size:11px; padding:3px 6px; border-radius:4px; display:inline-block;">HTML</span>`;
  if (['doc', 'docx'].includes(ext)) return `<span style="background:#e0e7ff; color:#4338ca; font-weight:800; font-size:11px; padding:3px 6px; border-radius:4px; display:inline-block;">DOC</span>`;
  if (['xls', 'xlsx', 'csv'].includes(ext)) return `<span style="background:#dcfce7; color:#15803d; font-weight:800; font-size:11px; padding:3px 6px; border-radius:4px; display:inline-block;">XLS</span>`;
  return `<span style="background:#f1f5f9; color:#475569; font-weight:800; font-size:11px; padding:3px 6px; border-radius:4px; display:inline-block;">FILE</span>`;
}

function printDocViewer() {
  const frame = document.getElementById('doc_frame');
  if (frame && frame.contentWindow) {
    try {

    } catch (e) {}

  window.print();
}

async function renderDocVaultView() {
  $("#main_content").innerHTML = `
    <div class="card" style="padding:40px; text-align:center;">

    </div>
  `;

  let docs = [];
  try {
    docs = await api("GET", "/api/documents");
  } catch (err) {
    docs = [];
  }

  // Resilient fallback: Query procs if empty
  if (!docs || !docs.length) {
    const list = L || [];
    const aggregated = [];
    for (const p of list) {
      try {
        const pd = await api("GET", `/api/procs/${p.id}`);
        if (pd && pd.docs && pd.docs.length) {
          pd.docs.forEach(d => {
            aggregated.push({
              ...d,
              proc_code: p.code,
              proc_title: p.title,
              proc_dept: p.dept,
              proc_type: p.type
            });
          });
        }
      } catch {}
    }
    docs = aggregated;
  }

  window._docVaultState.docs = docs || [];
  renderDocVaultUI();
}

  const logicCount = docs.filter(d => d.category === 'LogicNote').length;

  const totalBytes = docs.reduce((acc, d) => acc + (d.size || 0), 0);

function exportDocVaultCsv() {
  const docs = window._docVaultState.docs || [];
  if (!docs.length) return alert("No documents to export");
  const headers = ["ID", "File Name", "Stored Path", "Category", "PR Code", "PR Title", "Vendor", "Size Bytes", "Uploaded At", "Uploaded By"];
  const rows = docs.map(d => [
    d.id,
    `"${(d.orig || d.name || '').replace(/"/g, '""')}"`,
    `"${(d.path || '').replace(/"/g, '""')}"`,
    `"${(d.category || '').replace(/"/g, '""')}"`,
    `"${(d.proc_code || '').replace(/"/g, '""')}"`,
    `"${(d.proc_title || '').replace(/"/g, '""')}"`,
    `"${(d.vendor || '').replace(/"/g, '""')}"`,
    d.size || 0,
    `"${d.at || ''}"`,
    `"${d.by || ''}"`
  ]);
  const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", `ProcureLocal_Document_Vault_${new Date().toISOString().slice(0, 10)}.csv`);
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function normRptDate(s) {
  if (!s) return '';
  s = String(s).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s)) {
    const p = s.split('/');
    return p[2] + '-' + p[0].padStart(2, '0') + '-' + p[1].padStart(2, '0');
  }
  const d = new Date(s);
  if (!isNaN(d.getTime())) {
    const pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  return s;
}

function setReportQuickDate(preset) {
  window.rptFilter.quick = preset;
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const pad = n => String(n).padStart(2, '0');
  const fmt = dt => dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());

  if (preset === 'all') {
    window.rptFilter.dateFrom = '';
    window.rptFilter.dateTo = '';
  } else if (preset === 'today') {
    const s = fmt(now);
    window.rptFilter.dateFrom = s;
    window.rptFilter.dateTo = s;
  } else if (preset === 'week') {
    const day = now.getDay() || 7;
    const start = new Date(now);
    start.setDate(now.getDate() - day + 1);
    window.rptFilter.dateFrom = fmt(start);
    window.rptFilter.dateTo = fmt(now);
  } else if (preset === 'month') {
    const start = new Date(y, m, 1);
    window.rptFilter.dateFrom = fmt(start);
    window.rptFilter.dateTo = fmt(now);
  } else if (preset === 'quarter') {
    const qM = Math.floor(m / 3) * 3;
    const start = new Date(y, qM, 1);
    window.rptFilter.dateFrom = fmt(start);
    window.rptFilter.dateTo = fmt(now);
  } else if (preset === 'fy') {
    const fyY = m >= 3 ? y : y - 1;
    const start = new Date(fyY, 3, 1);
    window.rptFilter.dateFrom = fmt(start);
    window.rptFilter.dateTo = fmt(now);
  }
  renderReportsView();
}

function matchRpt(item, dateVal) {
  const f = window.rptFilter;
  if (f.dateFrom) {
    const nd = normRptDate(dateVal);
    if (nd && nd < f.dateFrom) return false;
  }
  if (f.dateTo) {
    const nd = normRptDate(dateVal);
    if (nd && nd > f.dateTo) return false;
  }
  if (f.vendorId) {
    const vid = item.vendor_id || item.vendorId;
    if (vid && String(vid) !== String(f.vendorId)) return false;
  }
  if (f.dept) {
    if (item.dept && item.dept !== f.dept) return false;
  }
  if (f.q) {
    const q = f.q.toLowerCase().trim();
    const str = [
      item.po_no, item.grn_no, item.invoice_no, item.asset_code, item.tag_code,
      item.asset_name, item.name, item.vendor_name, item.proc_code, item.proc_title,
      item.dept, item.serial_no, item.challan_no, item.vehicle_no, item.transporter,
      item.utr_no, item.custodian, item.plant_location, item.code, item.title
    ].filter(Boolean).join(' ').toLowerCase();
    if (!str.includes(q)) return false;
  }
  return true;
}

function downloadCsv(filename, rows) {
  const processCell = c => {
    let s = c === null || c === undefined ? '' : String(c);
    if (s.includes('"') || s.includes(',') || s.includes('\n') || s.includes('\r')) {
      s = '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  };
  const csvContent = rows.map(r => r.map(processCell).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadTextFile(filename, content, mimeType = 'text/html;charset=utf-8;') {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadFrameHtml(frameId, filename) {
  try {
    const frame = document.getElementById(frameId);
    if (!frame) return;
    const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
    if (!doc || !doc.documentElement) return alert('Frame document not loaded yet.');
    const html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    downloadTextFile(filename, html, 'text/html;charset=utf-8;');
    toast("Document Downloaded Successfully (HTML) 📥");
  } catch(e) {
    alert("Could not extract frame HTML: " + e.message);
  }
}

function printReportHtml(title, subtitle, tableHtml, kpiHtml) {
  const html = generateReportPrintHtml(title, subtitle, tableHtml, kpiHtml);
  let win = null;
  try {
    win = window.open('', '_blank');
  } catch(e) {}
  if (!win || win.closed || typeof win.closed === 'undefined') {
    openReportPreviewModal();
    return;
  }
  win.document.open();
  win.document.write(html);
  win.document.close();
  setTimeout(() => {
    try {
      win.focus();
      win.print();
    } catch(e) {
      openReportPreviewModal();
    }
  }, 350);
}

async function renderReportsView() {
  const contentEl = $("#main_content");
  if (!contentEl) return;

  // Render instantaneous loading state if data is being fetched
  if (!window._rptData) {
    contentEl.innerHTML = `
      <div class="card" style="padding:48px 24px; text-align:center;">
        <div style="font-size:32px; margin-bottom:12px;">⏳</div>
        <h3 style="margin:0 0 6px;">Loading Reports &amp; BI Studio...</h3>
        <p style="color:var(--tx-mut); font-size:12px; margin:0;">Compiling vendor spend registers, transaction ledgers, and audit logs...</p>
      </div>`;
  }

  let dataset = window._rptData;
  if (!dataset) {
    try {
      const res = await api("GET", "/api/reports/dataset");
      if (res && res.pos) {
        dataset = res;
        window._rptData = dataset;
      }
    } catch (e) {
      console.warn("Dataset API error, building client-side reports fallback...", e);
    }
  }

  // Resilient fallback: Assemble dataset directly from procs & proc details if needed
  if (!dataset || (!dataset.pos && !dataset.procs)) {
    try {
      const procs = (L && L.length) ? L : await api("GET", "/api/procs").catch(() => []);
      const vendors = (V && V.length) ? V : await api("GET", "/api/vendors").catch(() => []);
      const pos = [];
      const grns = [];
      const invoices = [];
      const assets = [];

      const details = await Promise.all(
        procs.map(p => api("GET", "/api/procs/" + p.id).catch(() => null))
      );

      details.forEach(d => {
        if (!d || !d.p) return;
        const p = d.p;
        (d.pos || []).forEach(po => {
          pos.push({
            ...po,
            proc_code: p.code,
            proc_title: p.title,
            dept: p.dept,
            proc_location: p.location,
            proc_type: p.type,
            proc_stage: p.stage,
            vendor_gst: (vendors.find(v => v.id === po.vendor_id) || {}).gst || '',
            vendor_city: (vendors.find(v => v.id === po.vendor_id) || {}).city || '',
            vendor_rating: (vendors.find(v => v.id === po.vendor_id) || {}).rating || 5
          });
        });
        (d.grns || []).forEach(g => {
          grns.push({
            ...g,
            proc_code: p.code,
            proc_title: p.title,
            dept: p.dept,
            vendor_name: (d.pos || []).find(po => po.id === g.po_id)?.vendor_name || g.vendor_name || 'Vendor',
            po_no: (d.pos || []).find(po => po.id === g.po_id)?.po_no || 'PO Ref'
          });
        });
        (d.invoices || []).forEach(inv => {
          invoices.push({
            ...inv,
            proc_code: p.code,
            proc_title: p.title,
            dept: p.dept,
            vendor_name: (d.pos || []).find(po => po.id === inv.po_id)?.vendor_name || inv.vendor_name || 'Vendor',
            po_no: (d.pos || []).find(po => po.id === inv.po_id)?.po_no || 'PO Ref'
          });
        });
        (d.assets || []).forEach(a => {
          assets.push({
            ...a,
            proc_code: p.code,
            proc_title: p.title,
            dept: p.dept,
            vendor_name: (d.pos || []).find(po => po.id === a.po_id)?.vendor_name || a.vendor_name || 'Vendor',
            po_no: (d.pos || []).find(po => po.id === a.po_id)?.po_no || 'PO Ref'
          });
        });
      });

      const depts = [...new Set(procs.map(p => p.dept).filter(Boolean))].sort();
      dataset = { pos, grns, invoices, assets, procs, vendors, depts };
      window._rptData = dataset;
    } catch (err2) {
      console.error("Critical fallback failed:", err2);
      dataset = { pos: [], grns: [], invoices: [], assets: [], procs: [], vendors: [], depts: [] };
    }
  }

  let analytics = window._rptAnalytics;
  if (!analytics) {
    try {
      analytics = await api("GET", "/api/analytics/spend");
      window._rptAnalytics = analytics;
    } catch {}
  }

  const pos = (dataset && dataset.pos) || [];
  const grns = (dataset && dataset.grns) || [];
  const invoices = (dataset && dataset.invoices) || [];
  const assets = (dataset && dataset.assets) || [];
  const procs = (dataset && dataset.procs) || L || [];
  const vendors = (dataset && dataset.vendors) || V || [];
  const depts = (dataset && dataset.depts) || [...new Set(procs.map(p => p.dept).filter(Boolean))].sort();

  // Filtered collections
  const fPos = pos.filter(p => matchRpt(p, p.po_date));
  const fGrns = grns.filter(g => matchRpt(g, g.grn_date));
  const fInvs = invoices.filter(i => matchRpt(i, i.invoice_date));
  const fAssets = assets.filter(a => matchRpt(a, a.capitalization_date || a.created_at));
  const fProcs = procs.filter(p => matchRpt(p, p.created));

  // Current sub-tab

  // Active Horizon label

    kpi1Val = inr(dSpend);

    kpi3Lbl = 'Engaged Vendors';
  }

  `;
}

function renderActiveReportContent(ctx) {
  const tab = window.rptTab || 'vendor';
  if (tab === 'pr') return renderPrReport(ctx);
  if (tab === 'vendor') return renderVendorReport(ctx);
  if (tab === 'datewise') return renderDatewiseReport(ctx);
  if (tab === 'po') return renderPoReport(ctx);
  if (tab === 'grn') return renderGrnReport(ctx);
  if (tab === 'invoice') return renderInvoiceReport(ctx);
  if (tab === 'asset') return renderAssetReport(ctx);
  if (tab === 'dept') return renderDeptReport(ctx);
  if (tab === 'analytics') return renderAnalyticsReport(ctx);
  return '<div style="padding:24px; text-align:center;">Select a report tab above.</div>';
}

function renderVendorReport(ctx) {
  const { fPos, vendors } = ctx;
  const f = window.rptFilter;

  // Group POs by Vendor
  const vendorSpendMap = {};
  fPos.forEach(p => {
    const key = p.vendor_id || p.vendor_name || 'Unknown';
    if (!vendorSpendMap[key]) {
      vendorSpendMap[key] = {
        vendor_id: p.vendor_id,
        vendor_name: p.vendor_name || 'Vendor #' + key,
        gst: p.vendor_gst || 'N/A',
        city: p.vendor_city || 'N/A',
        rating: p.vendor_rating || 5,
        orders: [],
        total_basic: 0,
        total_gst: 0,
        grand_total: 0
      };
    }
    const basic = Number(p.total_basic ?? p.basic_total) || 0;
    const gst = Number(p.total_gst ?? p.gst_total) || 0;
    const grand = Number(p.total_landed ?? p.grand_total) || 0;

    vendorSpendMap[key].orders.push(p);
    vendorSpendMap[key].total_basic += basic;
    vendorSpendMap[key].total_gst += gst;
    vendorSpendMap[key].grand_total += grand;
  });

  const vendorRankings = Object.values(vendorSpendMap).sort((a, b) => b.grand_total - a.grand_total);
  const totalAllSpend = vendorRankings.reduce((acc, v) => acc + v.grand_total, 0) || 1;

  // If a single vendor is specifically selected in filter
  if (f.vendorId) {
    const curV = vendors.find(v => String(v.id) === String(f.vendorId)) || vendorRankings.find(v => String(v.vendor_id) === String(f.vendorId)) || { name: 'Vendor #' + f.vendorId };
    const curStats = vendorSpendMap[f.vendorId] || { orders: [], grand_total: 0, total_basic: 0, total_gst: 0 };

    return `
      <div style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:14px 18px; margin-bottom:18px;">

            </div>
          </div>

            <button class="btn s" onclick="updateReportFilter('vendorId', '')">← Show All Vendors</button>

        </div>
      </div>

      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>PO #</th>
              <th>PO Date</th>
              <th>Requisition Ref &amp; Title</th>
              <th>Department</th>
              <th class="num">Basic Value (₹)</th>

              <th class="num">Landed Amount (₹)</th>
              <th>Payment Terms</th>
              <th>Delivery Terms</th>
              <th class="center">Action</th>
            </tr>
          </thead>
          <tbody>
            ${curStats.orders.map(po => `
              <tr>
                <td><b>${esc(po.po_no || 'PO-' + po.id)}</b></td>
                <td>${dmy(po.po_date)}</td>
                <td>
                  <a href="javascript:void(0)" onclick="openReq(${po.proc_id}); setTab('po');" style="font-weight:600; text-decoration:none; color:var(--pr);">
                    ${esc(po.proc_code || 'PR')}
                  </a> - ${esc(po.proc_title || 'Procurement')}
                </td>
                <td><span class="tag b-gray">${esc(po.dept || 'Plant')}</span></td>
                <td class="num">${inr(po.total_basic ?? po.basic_total)}</td>
                <td class="num">${inr(po.total_gst ?? po.gst_total)}</td>
                <td class="num"><b>${inr(po.total_landed ?? po.grand_total)}</b></td>
                <td><small>${esc(po.payment_terms || 'Standard')}</small></td>
                <td><small>${esc(po.delivery_terms || po.delivery_date || '-')}</small></td>
                <td class="center">
                  <div style="display:flex; gap:4px; justify-content:center;">
                    <button class="btn s p" onclick="openReportRecordDetail('po', ${po.id})" title="View, Print & Download Official PO Sheet">👁️ View PO</button>
                    <button class="btn s" onclick="openReq(${po.proc_id}); setTab('po');" title="Open in Studio">Studio →</button>
                  </div>
                </td>
              </tr>`).join('') || `<tr><td colspan="10" style="padding:24px; text-align:center; color:var(--tx-mut);">No purchase orders found for this vendor in the selected horizon.</td></tr>`}
          </tbody>
          <tfoot>
            <tr style="background:#f1f5f9; font-weight:700;">
              <td colspan="4">TOTAL FOR ${esc(curV.name).toUpperCase()} (${curStats.orders.length} ORDERS)</td>
              <td class="num">${inr(curStats.total_basic)}</td>
              <td class="num">${inr(curStats.total_gst)}</td>
              <td class="num" style="color:var(--pr);">${inr(curStats.grand_total)}</td>
              <td colspan="3"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    `;
  }

  // ALL VENDORS VIEW: Leaderboard + Master Breakdown

            return `
              <tr>
                <td class="center"><b>#${idx + 1}</b></td>
                <td><b>${esc(v.vendor_name)}</b></td>

                <td class="num">
                  <div style="display:flex; align-items:center; justify-content:flex-end; gap:6px;">
                    <span>${sharePct}%</span>
                    <div style="width:50px; height:6px; background:#e2e8f0; border-radius:99px; overflow:hidden;">
                      <div style="width:${Math.min(100, sharePct)}%; height:100%; background:var(--pr);"></div>
                    </div>
                  </div>
                </td>
                <td class="center">
                  <button class="btn s" onclick="updateReportFilter('vendorId', '${v.vendor_id || ''}')">Detailed Report &rarr;</button>

              </tr>`;
          }).join('') || `<tr><td colspan="9" style="padding:24px; text-align:center; color:var(--tx-mut);">No purchase orders found matching current filter scope. <button class="btn s" onclick="resetReportFilters()" style="margin-left:8px;">Reset Filters</button></td></tr>`}

    <!-- Complete PO Register under Vendor Tab -->
    <div style="margin-bottom:12px;">
      <h4 style="margin:0 0 6px; font-size:14px;">📑 Comprehensive Vendor Orders Master Register</h4>
    </div>

      <table>
        <thead>
          <tr>
            <th>PO #</th>
            <th>PO Date</th>
            <th>Vendor Name</th>
            <th>Requisition Code &amp; Title</th>

            <th class="num">GST (₹)</th>
            <th class="num">Landed Amount (₹)</th>
            <th>Payment Terms</th>

          ${fPos.map(po => `

              <td><span class="tag b-gray">${esc(po.dept || 'General')}</span></td>
              <td class="num">${inr(po.total_basic ?? po.basic_total)}</td>
              <td class="num">${inr(po.total_gst ?? po.gst_total)}</td>

// SUB-TAB 2: DATE-WISE PROCUREMENT CHRONOLOGICAL LEDGER
// --------------------------------------------------------------------------
function renderDatewiseReport(ctx) {
  const { fPos, fGrns, fInvs, fAssets } = ctx;

  const events = [];
  fPos.forEach(p => {
    events.push({
      date: normRptDate(p.po_date),
      type: 'PO Issued',
      badge: 'b-blue',
      ref: p.po_no || 'PO-' + p.id,
      pr_id: p.proc_id,
      pr_code: p.proc_code,
      title: p.proc_title,
      dept: p.dept,
      vendor: p.vendor_name,
      amount: p.total_landed ?? p.grand_total,
      notes: 'Terms: ' + (p.payment_terms || 'Standard'),
      tab: 'po',
      kind: 'po',
      raw_id: p.id
    });
  });
  fGrns.forEach(g => {
    events.push({
      date: normRptDate(g.grn_date),
      type: 'Store GRN Inward',
      badge: 'b-green',
      ref: g.grn_no || 'GRN-' + g.id,
      pr_id: g.proc_id,
      pr_code: g.proc_code,
      title: g.proc_title,
      dept: g.dept,
      vendor: g.vendor_name,
      amount: null,
      notes: 'Challan: ' + (g.challan_no || 'N/A') + ' | QC: ' + (g.inspection_status || g.status || 'Accepted'),
      tab: 'grn',
      kind: 'grn',
      raw_id: g.id
    });
  });
  fInvs.forEach(i => {
    events.push({
      date: normRptDate(i.invoice_date),
      type: 'Vendor Tax Invoice',
      badge: 'b-amber',
      ref: i.invoice_no || 'INV-' + i.id,
      pr_id: i.proc_id,
      pr_code: i.proc_code,
      title: i.proc_title,
      dept: i.dept,
      vendor: i.vendor_name,
      amount: i.total_amount ?? i.total_val,
      notes: ((i.match_status === 'MATCHED' || i.passed) ? '✔ 3-Way Matched' : 'Pending Verification') + (i.payment_status === 'Paid' ? ' (Paid: ' + (i.utr_no || 'RTGS') + ')' : ''),
      tab: 'inv',
      kind: 'invoice',
      raw_id: i.id
    });
  });
  fAssets.forEach(a => {
    events.push({
      date: normRptDate(a.capitalization_date || a.created_at),
      type: 'Asset Capitalized',
      badge: 'b-purple',
      ref: a.asset_code || a.tag_code || 'AST-' + a.id,
      pr_id: a.proc_id,
      pr_code: a.proc_code,
      title: a.asset_name || a.name,
      dept: a.dept,
      vendor: a.vendor_name,
      amount: a.cost ?? a.book_value,
      notes: 'Loc: ' + (a.plant_location || a.location || 'Plant') + ' | SN: ' + (a.serial_no || 'N/A'),
      tab: 'ast',
      kind: 'asset',
      raw_id: a.id
    });
  });

  events.sort((a, b) => (b.date > a.date ? 1 : (b.date < a.date ? -1 : 0)));
  const totalFinancial = events.reduce((acc, ev) => acc + (Number(ev.amount) || 0), 0);

  return `
    <div style="margin-bottom:12px;">
      <h4 style="margin:0 0 4px; font-size:14px;">📅 Chronological Master Procurement Audit Ledger</h4>
      <p style="margin:0 0 10px; color:var(--tx-mut); font-size:12px;">Real-time timeline of purchase orders, store goods receipts, vendor tax invoices, and capitalized plant assets</p>
    </div>

    <div class="tw">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Lifecycle Milestone</th>
            <th>Reference Code</th>
            <th>Requisition Code &amp; Title</th>
            <th>Department</th>
            <th>Vendor Name</th>
            <th class="num">Financial Value (₹)</th>
            <th>Audit Notes &amp; Status</th>
            <th class="center">Action</th>
          </tr>
        </thead>
        <tbody>
          ${events.map(ev => `
            <tr>
              <td><b>${dmy(ev.date)}</b></td>
              <td><span class="tag ${ev.badge}">${ev.type}</span></td>
              <td><b>${esc(ev.ref)}</b></td>
              <td>${esc(ev.pr_code || '')} - ${esc(ev.title || '')}</td>
              <td><span class="tag b-gray">${esc(ev.dept || 'Plant')}</span></td>
              <td><b>${esc(ev.vendor || 'Internal')}</b></td>
              <td class="num">${ev.amount !== null ? '<b>' + inr(ev.amount) + '</b>' : '<span style="color:var(--tx-mut);">-</span>'}</td>
              <td><small>${esc(ev.notes)}</small></td>
              <td class="center">
                <div style="display:flex; gap:4px; justify-content:center;">
                  <button class="btn s p" onclick="openReportRecordDetail('${ev.kind}', ${ev.raw_id})" title="View, Print & Download Document">👁️ View</button>
                  ${ev.pr_id ? `<button class="btn s" onclick="openReq(${ev.pr_id}); setTab('${ev.tab}');" title="Open in Studio">Studio →</button>` : ''}
                </div>
              </td>
            </tr>`).join('') || `<tr><td colspan="9" style="padding:24px; text-align:center; color:var(--tx-mut);">No transactions found in selected horizon. <button class="btn s" onclick="resetReportFilters()" style="margin-left:8px;">Reset Filters</button></td></tr>`}
        </tbody>
        <tfoot>
          <tr style="background:#f1f5f9; font-weight:700;">
            <td colspan="6">TOTAL CHRONOLOGICAL TRANSACTIONS (${events.length} EVENTS)</td>
            <td class="num" style="color:var(--pr);">${inr(totalFinancial)}</td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;
}

// SUB-TAB 3: PO MASTER REGISTER
// --------------------------------------------------------------------------
function renderPoReport(ctx) {

function renderDeptReport(ctx) {
  const { fPos, fProcs, depts } = ctx;

  const deptMap = {};
  depts.forEach(d => {
    deptMap[d] = { dept: d, pr_count: 0, capex_spend: 0, rev_spend: 0, total_spend: 0, orders: 0 };
  });

  fProcs.forEach(p => {
    const d = p.dept || 'General';
    if (!deptMap[d]) deptMap[d] = { dept: d, pr_count: 0, capex_spend: 0, rev_spend: 0, total_spend: 0, orders: 0 };
    deptMap[d].pr_count += 1;
  });

  fPos.forEach(po => {
    const d = po.dept || 'General';
    if (!deptMap[d]) deptMap[d] = { dept: d, pr_count: 0, capex_spend: 0, rev_spend: 0, total_spend: 0, orders: 0 };
    deptMap[d].orders += 1;
    const val = Number(po.total_landed ?? po.grand_total) || 0;
    deptMap[d].total_spend += val;
    if ((po.proc_type || '').toLowerCase() === 'capex') {
      deptMap[d].capex_spend += val;
    } else {
      deptMap[d].rev_spend += val;
    }
  });

  const deptRows = Object.values(deptMap).sort((a, b) => b.total_spend - a.total_spend);
  const grandCompanySpend = deptRows.reduce((a, b) => a + b.total_spend, 0) || 1;

  return `
    <div style="margin-bottom:12px;">
      <h4 style="margin:0 0 4px; font-size:14px;">🏛️ Department-wise Spend &amp; Capex vs Revenue Allocation MIS</h4>
      <p style="margin:0 0 10px; color:var(--tx-mut); font-size:12px;">Budget monitoring, Capital Expenditure (Capex) vs Operational Revenue Expenditure (Opex/Rev) per business unit</p>
    </div>

    <div class="tw">
      <table>
        <thead>
          <tr>
            <th>Department</th>
            <th class="center">Requisitions</th>
            <th class="center">PO Orders</th>
            <th class="num">Capex Spend (₹)</th>
            <th class="num">Revenue Spend (₹)</th>
            <th class="num">Total Landed Spend (₹)</th>
            <th class="num">Spend Share %</th>
            <th>Spend Share Distribution</th>
            <th class="center">Action</th>
          </tr>
        </thead>
        <tbody>
          ${deptRows.map(d => {
            const sharePct = ((d.total_spend / grandCompanySpend) * 100).toFixed(1);
            return `
              <tr>
                <td><b>${esc(d.dept)}</b></td>
                <td class="center"><span class="tag b-gray">${d.pr_count} Indents</span></td>
                <td class="center"><span class="tag b-blue">${d.orders} Orders</span></td>
                <td class="num">${inr(d.capex_spend)}</td>
                <td class="num">${inr(d.rev_spend)}</td>
                <td class="num"><b>${inr(d.total_spend)}</b></td>
                <td class="num"><b>${sharePct}%</b></td>
                <td style="min-width:140px;">
                  <div style="width:100%; height:8px; background:#e2e8f0; border-radius:99px; overflow:hidden;">
                    <div style="width:${Math.min(100, sharePct)}%; height:100%; background:var(--pr);"></div>
                  </div>
                </td>
                <td class="center">
                  <button class="btn s" onclick="updateReportFilter('dept', '${esc(d.dept)}'); setReportTab('po');" title="Filter POs by this department">View Orders →</button>
                </td>
              </tr>`;
          }).join('') || `<tr><td colspan="9" style="padding:24px; text-align:center; color:var(--tx-mut);">No department spend data available. <button class="btn s" onclick="resetReportFilters()" style="margin-left:8px;">Reset Filters</button></td></tr>`}
        </tbody>
        <tfoot>
          <tr style="background:#f1f5f9; font-weight:700;">
            <td>CONSOLIDATED TOTALS</td>
            <td class="center">${fProcs.length} Indents</td>
            <td class="center">${fPos.length} Orders</td>
            <td class="num">${inr(deptRows.reduce((a, b) => a + b.capex_spend, 0))}</td>
            <td class="num">${inr(deptRows.reduce((a, b) => a + b.rev_spend, 0))}</td>
            <td class="num" style="color:var(--pr);">${inr(grandCompanySpend)}</td>
            <td class="num">100.0%</td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  `;
}

function exportCurrentReportCsv() {
  const dataset = window._rptData || { pos: [], grns: [], invoices: [], assets: [], procs: [], vendors: [], depts: [] };
  const tab = window.rptTab || 'vendor';
  const fPos = (dataset.pos || []).filter(p => matchRpt(p, p.po_date));
  const fGrns = (dataset.grns || []).filter(g => matchRpt(g, g.grn_date));
  const fInvs = (dataset.invoices || []).filter(i => matchRpt(i, i.invoice_date));
  const fAssets = (dataset.assets || []).filter(a => matchRpt(a, a.capitalization_date || a.created_at));
  const fProcs = (dataset.procs || []).filter(p => matchRpt(p, p.created));

  const filename = 'ProcureLocal_Report_' + tab + '_' + td() + '.csv';

  if (tab === 'pr') {
    const rows = [
      ['PR Code', 'Date', 'Requisition Title', 'Department', 'Delivery Location', 'Type', 'Kind', 'Sanctioned / Est Value', 'Current Stage', 'Locked Status']
    ];
    fProcs.forEach(p => {
      rows.push([
        p.code || '',
        p.created || '',
        p.title || '',
        p.dept || '',
        p.location || '',
        (p.type || '').toUpperCase(),
        (p.kind || '').toUpperCase(),
        p.total_sanctioned ?? p.est ?? 0,
        p.stage || '',
        (p.stage === 'completed' || p.is_locked == 1) ? 'Locked' : 'Active'
      ]);
    });
    downloadCsv(filename, rows);
  } else if (tab === 'vendor' || tab === 'po') {
    const rows = [
      ['PO Number', 'PO Date', 'Vendor Name', 'Vendor GSTIN', 'Requisition Code', 'Title', 'Department', 'Basic Value', 'GST Value', 'Grand Landed Total', 'Delivery Terms', 'Payment Terms', 'Stage']
    ];
    fPos.forEach(p => {
      rows.push([
        p.po_no || 'PO-' + p.id,
        p.po_date || '',
        p.vendor_name || '',
        p.vendor_gst || '',
        p.proc_code || '',
        p.proc_title || '',
        p.dept || '',
        p.total_basic ?? p.basic_total ?? 0,
        p.total_gst ?? p.gst_total ?? 0,
        p.total_landed ?? p.grand_total ?? 0,
        p.delivery_terms || p.delivery_date || '',
        p.payment_terms || '',
        p.proc_stage || 'order'
      ]);

async function testStoragePathAction() {
  const target = ($('#cfg_remote_db_input')?.value || '').trim();
  const box = $('#storage_test_result_box');
  if (!target) return alert("Please enter the network share path to test.");
  if (box) {
    box.style.display = 'block';
    box.style.background = '#f8fafc';
    box.style.border = '1px solid #cbd5e1';
    box.style.color = '#334155';
    box.innerHTML = 'Testing network share connection and write access...';
  }
  try {
    const res = await api("POST", "/api/system/test-storage", { dataDir: target });
    if (res.ok) {
      box.style.background = '#f0fdf4';
      box.style.border = '1px solid #86efac';
      box.style.color = '#166534';
      box.innerHTML = `✔ <b>Connection Successful!</b> Verified read and write access to: <code>${esc(res.targetPath)}</code>`;

  } catch (err) {
    box.style.background = '#fef2f2';
    box.style.border = '1px solid #fca5a5';
    box.style.color = '#991b1b';
    box.innerHTML = `⚠️ <b>Connection Failed:</b> ${esc(err.message || 'Cannot access specified directory')}`;
  }
}

// Filter Audit Trail in Settings
function filterAuditRows() {
  const q = ($("#audit_search")?.value || "").toLowerCase().trim();
  const cat = ($("#audit_filter")?.value || "").toLowerCase().trim();
  const rows = $$("#audit_tbody tr");
  let visible = 0;
  rows.forEach(tr => {
    const text = tr.getAttribute("data-text") || "";
    const matchQ = !q || text.includes(q);
    const matchCat = !cat || text.includes(cat);
    if (matchQ && matchCat) {
      tr.style.display = "";
      visible++;
    } else {
      tr.style.display = "none";
    }
  });
  if ($("#audit_count_badge")) $("#audit_count_badge").textContent = `${visible} of ${rows.length} Events Logged`;
}

  toast("Bidding Slab Saved ✔");

                <span class="tag b-green" style="font-weight:700;">EDITING ACTIVE</span>
              </div>
              <p style="margin:3px 0 0; font-size:12.5px; color:#15803d;">
                Authorized and unlocked by <b>${esc(p.unlock_approved_by || 'Admin')}</b>${p.unlock_approved_at ? ` on ${dmy(p.unlock_approved_at)}` : ''}.
                You may now perform needed updates or corrections across PO, GRN, and Assets. All actions are logged.
              </p>
            </div>
          </div>
          <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn s" style="background:#dc2626; color:#fff; border-color:#b91c1c; font-weight:700; box-shadow:0 2px 4px rgba(220,38,38,0.25);" onclick="relockRequisition()">
              🔒 Re-Lock &amp; Freeze Record
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if (status === 'unlock_requested') {
    const canReview = canApproveUnlock();
    return `
      <div class="card" style="margin-bottom:14px; border:2px solid #f59e0b; background:#fffbeb; box-shadow:0 2px 8px rgba(245,158,11,0.15);">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div style="display:flex; align-items:flex-start; gap:12px;">
            <div style="font-size:32px; line-height:1;">⏳</div>
            <div>
              <div style="display:flex; align-items:center; gap:8px;">
                <h3 style="margin:0; color:#92400e; font-size:16px;">Unlock Permission Requested — Approval Required</h3>
                <span class="tag b-amber" style="font-weight:700;">APPROVAL PENDING</span>
              </div>
              <p style="margin:3px 0 0; font-size:12.5px; color:#78350f;">
                Requested by <b>${esc(p.unlock_requested_by || 'User')}</b>${p.unlock_requested_at ? ` on ${dmy(p.unlock_requested_at)}` : ''}.
              </p>
              <div style="margin-top:6px; font-size:12px; color:#92400e; background:rgba(245,158,11,0.15); padding:6px 12px; border-radius:6px; border-left:3px solid #f59e0b;">
                <b>Business Justification:</b> "${esc(p.unlock_reason || latestReq?.reason || 'No justification provided')}"
              </div>
            </div>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            ${canReview ? `
              <button class="btn s g" style="font-weight:700;" onclick="openReviewUnlockModal('approve')">✓ Approve Unlock (Allow Modification)</button>
              <button class="btn s r" onclick="openReviewUnlockModal('reject')">✕ Reject</button>
            ` : `
              <span class="tag b-amber" style="padding:6px 12px; font-size:12px;">Waiting for Commercial Head / Admin Review</span>
            `}
          </div>
        </div>
      </div>
    `;
  }

  // Locked State
  return `
    <div class="card" style="margin-bottom:14px; border:2px solid #cbd5e1; background:#f8fafc; border-left:5px solid #64748b; box-shadow:0 1px 4px rgba(0,0,0,0.05);">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="font-size:30px; line-height:1;">🔒</div>
          <div>
            <div style="display:flex; align-items:center; gap:8px;">
              <h3 style="margin:0; color:#1e293b; font-size:15px;">Order Finalized &amp; Process Locked (Audit Lock Active)</h3>
              <span class="tag b-gray" style="font-weight:700;">LOCKED</span>
            </div>
            <p style="margin:3px 0 0; font-size:12.5px; color:#475569;">
              This procurement lifecycle is completed &amp; archived. To maintain SOX / ISO audit compliance, direct editing is restricted.
              Modifications require a separate unlock request with clear business justification.
            </p>
          </div>
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          ${adm() || canApproveUnlock() ? `
            <button class="btn s" style="background:#2563eb; color:#fff; border-color:#1d4ed8; font-weight:700; box-shadow:0 2px 4px rgba(37,99,235,0.25);" onclick="openAdminDirectUnlockModal(${p.id})">
              🔓 Admin Permission: Unlock Requisition for Editing
            </button>
          ` : (U && U.role !== 'viewer' ? `
            <button class="btn p s" style="background:#475569; border-color:#334155; font-weight:600;" onclick="openRequestUnlockModal()">
              🔓 Request Permission to Edit / Unlock
            </button>
          ` : '')}
        </div>
      </div>
    </div>
  `;
}

  const curStageIdx = fl.indexOf(p.stage);
  const w = can();

  const tabsConfig = [
    ["ov", "Overview &amp; Items"],
    ["qt", "Quotations &amp; RFQ", D.quotes.length],
    ["cst", "Comparative Statement (CST)"],

    ["inv", "3-Way Match &amp; Invoices", (D.invoices || []).length],
    ["ap", "Approvals &amp; SAP"],
    ["dc", "Documents", D.docs.length],
    ["hs", "Audit History"]
  ];

  const subViewMap = {
    ov: renderDetailOverview,
    qt: renderDetailQuotes,

        <span class="tag ${p.type === 'capex' ? 'b-purple' : 'b-blue'}">${p.type.toUpperCase()} ${p.kind.toUpperCase()}</span>

        <span class="tag b-gray">Store: ${esc(p.location)}</span>
        ${isLocked(p) ? `<span class="tag b-gray" style="background:#fee2e2; color:#991b1b; font-weight:700;">🔒 AUDIT LOCKED</span>` : ''}
        ${p.unlock_status === 'unlock_requested' ? `<span class="tag b-amber" style="font-weight:700;">⏳ UNLOCK REQUESTED</span>` : ''}
        ${p.unlock_status === 'unlocked' ? `<span class="tag b-green" style="font-weight:700;">🔓 UNLOCKED (EDITING ACTIVE)</span>` : ''}
      </div>
      <div class="row" style="gap:6px;">
        <a class="btn s" href="/api/procs/${p.id}/logic/print" target="_blank" style="font-weight:600;"><svg style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>🖨️ Print Logic Note</a>
        ${w ? `<button class="btn s" onclick="openEditReqModal()"><svg style="width:13px;height:13px;vertical-align:-2px;margin-right:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>✏️ Edit Details</button>` : ""}
        ${w && curStageIdx > 0 ? `<button class="btn s" onclick="if(confirm('Move back one stage?'))A('back')">↩ Back One Stage</button>` : ""}
        ${w ? `<button class="btn s" onclick="copyAsNew()">⧉ Copy</button>` : ""}
        ${adm() && !isLocked(p) ? `<button class="btn s r" onclick="deleteReq()">Delete</button>` : ""}
      </div>
    </div>

    <!-- Security Lock / Unlock Status Banner -->
    ${renderLockBanner(p)}

    <!-- 9-Stage Stepper -->
    <div class="stp">
      ${fl.slice(0, -1).map((s, k) => `
        <div class="stp-item ${k < curStageIdx ? 'done' : k === curStageIdx ? 'cur' : ''}">
          <i>${k < curStageIdx ? '✓' : k + 1}</i>
          <div>${SL[s] || s}</div>
        </div>`).join("")}
    </div>

    <!-- Action Command Banner -->
    ${renderActionBanner()}

    <!-- Tabs Navigation -->
    <div class="tabs">
      ${tabsConfig.map(tc => `
        <button class="${rtab === tc[0] ? 'on' : ''}" onclick="setTab('${tc[0]}')">
